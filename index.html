<style>

@media(max-width:900px){aside{border-left:0;border-top:1px solid var(--ln)}}

.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.btn{border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}.btn.o{background:transparent;color:var(--ac)}.btn.r{background:#b3261e;border-color:#b3261e}
.mu{color:var(--mu);font-size:12px}.tag{font-size:11px;padding:2px 7px;border-radius:99px;color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin-bottom:8px}.tabs button{flex:1;border:0;background:none;padding:7px 2px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mu)}.tabs button.on{color:var(--tx);border-color:var(--ac)}

.btn:disabled{opacity:.45;cursor:not-allowed}

select,input{border:1px solid var(--ln);background:var(--pn);border-radius:6px;padding:4px 6px}
.chip.on{background:var(--ac);color:#fff}@media print{body>nav,main,#ov,.noprint{display:none!important}#ov2{position:static!important;background:none!important;display:block!important}#ov2 .card{box-shadow:none!important;border:0!important;max-height:none!important;overflow:visible!important}}
.cph{margin:16px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:700}.cpr{display:grid;grid-template-columns:minmax(140px,38%) 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:13px}@media(max-width:600px){.cpr{grid-template-columns:1fr;gap:2px}}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

.cpi:hover{background:var(--av)}.cpi.on{background:var(--av);border-left-color:var(--ac);font-weight:600}

@media(max-width:700px){#ov3 .card{width:100vw;height:100%;border-radius:0}.cpw{grid-template-columns:1fr}.cpw.sel .cpl{display:none}.cpw:not(.sel) .cpd{display:none}.cpback{display:inline-block}.cpl{border-right:0}.cpd{padding:12px 14px 24px}}
</style></head><body>
<nav><h1>Activity Assignment Board - Ngapori Ranch Greenhouse</h1><span class="pill" id="net"></span>
<button data-a="plan" id="plb">Season planning</button><button data-a="cprof" id="cpb">Crop profile</button><button data-a="refresh">Refresh</button><button data-a="theme">Theme</button><button data-a="login" id="lg">Log out</button></nav>

<div class="ov" id="ov3"><div class="card" role="dialog" aria-modal="true" aria-label="Crop profile"></div></div>
<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxI5EoHK-uRAthC9-V6X1xkXaNvGJYuBmOyI4ox7xeNiTw6rmRPA6mWbw01wKzTbtw5Aw/exec';           // paste the Apps Script web app /exec URL (Code_GH.gs); blank = demo mode
const IS_DEMO=!WEB_APP_URL, TIMEOUT=20000;
const STAGE={PRE_PLANTING:'#D8CFAE',GROWING:'#8FBF8A',HARVEST_READY:'#2E7D32',HARVEST_COMPLETE:'#7C8B98',TERMINATED:'#C9C2AE'};

const BAYS=[['GH-1','Bay 1 Cold zone','R',5],['GH-2','Bay 2 Temperate canopy','B',8],['GH-3','Bay 3 Indigenous specialty','B',8],['GH-4','Bay 4 Tropical high-wire','G',5]];
const BEDS=[];BAYS.forEach(b=>{for(let i=1;i<=b[3];i++)BEDS.push({id:`${b[0]}-${b[2]}${String(i).padStart(2,'0')}`,bay:b[0],ok:true})});
BEDS.find(b=>b.id=='GH-3-B08').ok=false;
const d=o=>{const x=new Date();x.setDate(x.getDate()+o);return x.toISOString().slice(0,10)};
const C=[['ASP-GH-2027-W01','Asparagus','GH-1-R01','GROWING',-240,730,730],['SP-GH-2027-W01','Sweet Potatoes','GH-1-R02','GROWING',-120,100,120],['CAR-GH-2027-W01','Carrots','GH-1-R04','GROWING',-35,65,80],['BRO-GH-2027-W01','Broccoli','GH-1-R05','PRE_PLANTING',5,60,80],
['LET-GH-2027-W01','Lettuce','GH-2-B01','HARVEST_READY',-50,45,60],['LET-GH-2027-W02','Lettuce','GH-2-B02','GROWING',-30,45,60],['SPI-GH-2027-W01','Spinach','GH-2-B03','PRE_PLANTING',2,35,45],['KAL-GH-2027-W01','Kale','GH-2-B04','GROWING',-40,55,75],['CHD-GH-2027-W01','Swiss Chard','GH-2-B06','HARVEST_COMPLETE',-70,45,60],
['BTL-GH-2027-W01','Bitter Leaf','GH-3-B01','GROWING',-150,60,60],['UGW-GH-2027-W01','Ugwu','GH-3-B02','GROWING',-90,60,90],['UGW-GH-2027-W02','Ugwu','GH-3-B03','HARVEST_READY',-95,60,90],['SUK-GH-2027-W01','Sukuma Wiki','GH-3-B04','GROWING',-20,50,70],
['PLN-GH-2027-W01','Plantains','GH-4-G01','GROWING',-200,365,540],['TOM-GH-2027-W01','Tomatoes','GH-4-G02','GROWING',-45,60,80],['PEP-GH-2027-W01','Peppers','GH-4-G04','TERMINATED',-60,65,75]]
.map(c=>({id:c[0],crop:c[1],bed:c[2],stage:c[3],dob:d(c[4]),hs:d(c[4]+c[5]),he:d(c[4]+c[6])}));
const P=[['ONI-GH-2027-W01','Onions','GH-1-R03',7],['TUR-GH-2027-W01','Turnips','GH-1-R03',14],['COL-GH-2027-W01','Collard Greens','GH-2-B07',9],['MUS-GH-2027-W01','Mustard Greens','GH-2-B08',12],['MCH-GH-2027-W01','Mchicha','GH-3-B05',10],['AMG-GH-2027-W01','Amaranth Grain','GH-4-G02',21],['EGG-GH-2027-W01','Eggplant','GH-4-G03',8],['HAB-GH-2027-W01','Habanero','GH-4-G05',16]]
.map(p=>({id:p[0],crop:p[1],rec:p[2],date:d(p[3])}));
const EX=[{id:'EX-1',bed:'GH-4-G02',type:'Gutter drip leak',sev:'HIGH',open:true,note:'Reported on morning walk'}];
const ACTS=[];   // {id,name,group,phase,req} from ACTIVITIES_REFERENCE (live); demo seed below
if(IS_DEMO)Object.entries({'Soil & Bed Prep':['Pull plastic & drip','Bed prep & fertigation check','Install trellis'],'Crop Maintenance':['Prune & train','Scout pests','Irrigation check','Thin & weed'],'Harvest Operations':['Harvest','Grade & pack','Haul to cooler'],'Post-Harvest & Sanitation':['Clear debris','Power-wash bench or flush gutter','Verify bed ready']}).forEach(([g,l])=>l.forEach(n=>ACTS.push({id:'ACT-D'+String(ACTS.length+1).padStart(2,'0'),name:n,group:g,phase:g=='Harvest Operations'?'Harvest':g=='Post-Harvest & Sanitation'?'Post-Harvest':'Maintenance',req:g=='Post-Harvest & Sanitation'?'Yes':'No'})));
const WORKERS=['lisa','john','amara','kofi'].map(x=>({id:x,name:x[0].toUpperCase()+x.slice(1)})),HIST=[],DONE={},OVR={};   // DONE: bed -> completed activity names; OVR: bed -> {activity: {by,reason}} for manager overrides
const S={view:'stage',filt:'ALL',sel:null,tab:'Overview',net:IS_DEMO?'demo':'wait',tasks:[],cat:'ALL',user:IS_DEMO,tok:null,upd:'',err:'',crew:new Set(),picked:[],when:0,needLogin:false,queue:false};
async function api(action,payload){if(IS_DEMO)return{ok:true};const c=new AbortController(),t=setTimeout(()=>c.abort(),TIMEOUT);let j;
try{const r=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.tok,...payload}),signal:c.signal});j=await r.json()}
catch(e){S.net='offline';S.err='cannot reach web app';throw new Error('Could not reach the workbook')}finally{clearTimeout(t)}
S.net='online';S.err='';if(!j.ok){if(j.error=='Session expired'){S.tok=null;S.user=null;S.needLogin=true;try{sessionStorage.removeItem('gh')}catch(x){}}throw new Error(j.error||'Workbook rejected the change')}return j}
const WR=new Set(['gengo','vready','override','plant','ready','done','turn','term','move','verifybed','dispatch','dn','rt','appr','apprall','rej']);
async function load(){const r=await api('load');BAYS.length=BEDS.length=C.length=P.length=0;S.tasks.length=0;
ACTS.length=0;ACTS.push(...(r.activities||[]));if(!IS_DEMO&&!r.activities)toast('Web app is out of date: redeploy Code_GH.gs as a new version');else if(!IS_DEMO&&!r.activities.length)toast('ACTIVITIES_REFERENCE has no rows with Active = Yes');BAYS.push(...r.bays);BEDS.push(...r.beds);C.push(...r.cohorts);P.push(...r.proposals);S.tasks.push(...r.tasks.map((t,i)=>({...t,i})));
if(r.workers&&r.workers.length){WORKERS.length=0;WORKERS.push(...r.workers)}
HIST.length=0;HIST.push(...(r.history||[]));Object.keys(DONE).forEach(k=>delete DONE[k]);Object.assign(DONE,r.done||{});Object.keys(OVR).forEach(k=>delete OVR[k]);Object.assign(OVR,r.ovr||{});S.upd=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
const cohortOf=b=>C.find(c=>c.bed==b&&c.stage!='TERMINATED'&&c.stage!='HARVEST_COMPLETE')||C.find(c=>c.bed==b);
const propOf=b=>P.filter(p=>p.rec==b);
const exOf=b=>EX.filter(e=>e.bed==b&&e.open);
const tasksOf=b=>S.tasks.filter(t=>t.bed==b&&t.st!='DONE');
function state(b){const bd=BEDS.find(x=>x.id==b),c=cohortOf(b);
if(exOf(b).length)return'EXCEPTION';if(!bd.ok)return'UNVERIFIED';if(c&&(c.stage=='HARVEST_COMPLETE'||c.stage=='TERMINATED'))return'POST_HARVEST';if(c)return'OCCUPIED';if(propOf(b).length)return'PROPOSED';return'AVAILABLE'}
function queue(b){const c=cohortOf(b);if(exOf(b).length||(c&&c.stage=='HARVEST_READY'))return'MUST_DO';if(c&&(c.stage=='PRE_PLANTING'||state(b)=='POST_HARVEST'))return'ATTENTION';if(c)return'ROUTINE';if(propOf(b).length)return'PROPOSED';return null}
function fill(b){const st=state(b),c=cohortOf(b);if(S.view=='queue'){const q=queue(b);return q?QCOL[q]:'#E4EDE6'}
if(c)return STAGE[c.stage];return{PROPOSED:'#F6E3B0',UNVERIFIED:'#cfd4d0',AVAILABLE:'#E4EDE6',EXCEPTION:'#F2C4BF'}[st]||'#E4EDE6'}
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function drawTop(){el('net').innerHTML=S.net=='demo'?'Demo mode (no web app URL)':S.net=='wait'?'Connecting...':S.net=='online'?`<span class="dot" style="background:#66bb6a"></span>Connected${S.upd?' - updated '+S.upd:''}`:`<span class="dot" style="background:#ef5350"></span>Not connected${S.err?': '+esc(S.err):''}`;
el('plb').style.display=canGen()?'':'none';el('lg').textContent=S.user?'Log out'+(S.user.name?' ('+S.user.name+')':''):'Log in';el('ov').style.display=S.needLogin?'flex':'none';
el('tb').innerHTML=['ALL','OCCUPIED','PROPOSED','AVAILABLE','UNVERIFIED','POST_HARVEST','EXCEPTION'].map(f=>`<button class="chip ${S.filt==f?'on':''}" data-f="${f}">${f.replace('_',' ').toLowerCase()}</button>`).join('')+`<button class="btn" data-a="queue">Assignment queue (${P.length})</button>`;
el('vw').innerHTML=['stage','queue'].map(v=>`<button class="chip ${S.view==v?'on':''}" data-v="${v}">${v=='stage'?'Current stage':'Queue priority'}</button>`).join('');
const L=S.view=='stage'?Object.entries(STAGE):Object.entries(QCOL);el('lg2').innerHTML=L.map(([k,v])=>`<span><i style="background:${v}"></i>${k.replace('_',' ').toLowerCase()}</span>`).join('')+'<span><i style="background:#E4EDE6;border:1px solid #9bb0a2"></i>available</span><span><i style="background:#C77700;border-radius:50%"></i>required steps open</span>'}
function drawMap(){let y=14,h='';BAYS.forEach(b=>{h+=`<text x="12" y="${y+8}" font-size="13" font-weight="600" fill="var(--tx)">${b[1]}</text>`;y+=16;
BEDS.filter(x=>x.bay==b[0]).forEach(bd=>{const st=state(bd.id),c=cohortOf(bd.id),dim=S.filt!='ALL'&&S.filt!=st,tk=tasksOf(bd.id).length,ex=exOf(bd.id).length,sel=S.sel==bd.id,rq=c?flow(bd.id).left:0;
const lab=c?c.crop:propOf(bd.id).length?'Proposed: '+propOf(bd.id).map(p=>p.crop).join(', '):st=='UNVERIFIED'?'Not verified':'Available';
h+=`<g class="bed" tabindex="0" role="button" data-b="${bd.id}" opacity="${dim?.25:1}" aria-label="${bd.id} ${esc(lab)}"><rect x="12" y="${y}" width="756" height="26" rx="5" fill="${fill(bd.id)}" stroke="${sel?'var(--tx)':st=='PROPOSED'?'#C77700':st=='UNVERIFIED'?'#889':'var(--ln)'}" stroke-width="${sel?2.5:1}" ${st=='PROPOSED'||st=='UNVERIFIED'?'stroke-dasharray="5 3"':''}/>
<text x="22" y="${y+17}" font-size="12" font-weight="600" fill="#12201a">${bd.id}</text><text x="108" y="${y+17}" font-size="12" fill="#12201a">${esc(lab)}${c?' - '+c.stage.replace('_',' ').toLowerCase():''}</text>
${ex?`<circle cx="744" cy="${y+13}" r="8" fill="#B3261E"/><text x="744" y="${y+17}" font-size="11" text-anchor="middle" fill="#fff">!</text>`:''}${rq?`<circle cx="664" cy="${y+13}" r="8" fill="#C77700"/><text x="664" y="${y+17}" font-size="11" text-anchor="middle" fill="#fff">${rq}</text>`:''}${tk?`<circle cx="720" cy="${y+13}" r="8" fill="#1f3a2e"/><text x="720" y="${y+17}" font-size="11" text-anchor="middle" fill="#fff">${tk}</text>`:''}
${c&&c.stage=='HARVEST_READY'?`<text x="692" y="${y+18}" font-size="14">&#9986;</text>`:''}</g>`;y+=30});y+=10});
el('svg').setAttribute('viewBox','0 0 780 '+y);el('svg').innerHTML=h}
const dl=c=>c.dl||'Planting date';
/* ---- Activity rules (mirrors ACTIVITIES_REFERENCE and the checks in Code_GH.gs): phase gate, prerequisite, required steps, manager override ---- */
const STG={'Pre-Planting':['PRE_PLANTING',''],'Propagation':['PRE_PLANTING',''],'Planting':['PRE_PLANTING'],'Maintenance':['GROWING','HARVEST_READY',''],'IPM & Calibration':['GROWING','HARVEST_READY',''],   // '' = bed with no cohort yet (empty or proposed): prep work can be assigned so gates can be unlocked
'Harvest':['HARVEST_READY'],'Post-Harvest':['HARVEST_COMPLETE','TERMINATED']};
const STG_MSG={'Pre-Planting':'only before planting','Propagation':'only before planting','Maintenance':'not after harvest / before planting','IPM & Calibration':'not after harvest / before planting','Harvest':'needs manager maturity check','Post-Harvest':'after harvest is complete'};
const applies=(a,bd)=>{const m=a.name.match(/\(Bays? ([\d &]+)\)/);return!m||!bd||m[1].split(/\D+/).includes(String(bd.bay).replace(/\D/g,''))};
const isDone=(b,a)=>(DONE[b]||[]).includes(a.name),preOf=a=>a.pre?ACTS.find(x=>x.id==a.pre):null,depOf=a=>ACTS.filter(x=>x.pre==a.id);
function stageWhy(a,b){const c=cohortOf(b),ok=STG[a.phase];if(!ok)return'';const s=c?c.stage:'';
if(a.phase=='Planting')return s=='PRE_PLANTING'?(c.ver?'':'needs manager bed verification'):'needs a cohort awaiting planting';
return ok.includes(s)?'':STG_MSG[a.phase]||''}
function why(a,b){const bd=BEDS.find(x=>x.id==b);if(!applies(a,bd))return'other bay';const s=stageWhy(a,b);if(s)return s;const p=preOf(a);if(p&&!isDone(b,p))return'do '+p.id+' first';return''}

document.addEventListener('click',async e=>{const pl0=el('pl');if(pl0)S.psc=pl0.scrollTop;const t=e.target.closest('[data-a],[data-f],[data-v],[data-b],[data-t],[data-c]');if(!t)return;const D=t.dataset,b=S.sel,c=b&&cohortOf(b);
if(D.f)S.filt=D.f;else if(D.v)S.view=D.v;else if(D.b){S.sel=D.b;S.queue=false;S.tab='Overview';S.picked=[]}else if(D.t)S.tab=D.t;else if(D.c)S.cat=D.c;
else try{switch(D.a){case'close':S.sel=null;S.queue=false;break;case'queue':S.queue=true;break;case'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';break;
case'login':if(IS_DEMO){S.user=!S.user;toast(S.user?'Logged in':'Logged out')}else{S.tok=null;S.user=null;S.needLogin=true;try{sessionStorage.removeItem('gh')}catch(x){}}break;
case'dologin':{const r=await api('login',{user:el('lu').value,pin:el('lp').value});S.tok=r.token;S.user=r.user;S.needLogin=false;el('lp').value='';try{sessionStorage.setItem('gh',JSON.stringify({tok:r.token,user:r.user}))}catch(x){}await load();break}
case'refresh':await load();toast('Refreshed');break;
case'wk':S.crew.has(D.i)?S.crew.delete(D.i):S.crew.add(D.i);break;case'allw':S.crew=new Set(WORKERS.map(w=>w.id));break;case'clrw':S.crew=new Set();break;case'when':S.when=+D.i;break;
case'clrp':S.picked=[];break;case'pick':{const i=S.picked.findIndex(q=>q.act==D.i);i<0?S.picked.push({act:D.i,crew:null}):S.picked.splice(i,1);break}case'rmp':S.picked.splice(+D.i,1);break;case'cust':{const q=S.picked[+D.i];q.crew=q.crew?null:[...S.crew];break}
case'pwk':{const q=S.picked[+D.i];q.crew=q.crew.includes(D.w)?q.crew.filter(x=>x!=D.w):[...q.crew,D.w];break}
case'override':{const st=el('ovs').value,r=el('ovr').value.trim();if(!st||!r){toast('Pick a step and write the reason');return}await api('override',{bed:b,act:st,reason:r});(DONE[b]=DONE[b]||[]).push(st);(OVR[b]=OVR[b]||{})[st]={by:(S.user&&S.user.name)||'you',reason:r};toast('Override logged');break}
case'plan':{if(IS_DEMO){toast('Season planning needs the connected workbook (demo mode has no data)');break}if(!canGen()){toast('Season planning is for the Manager role');break}const i=await api('planInit');S.gen={init:i,form:{year:i.defaults.year,interval:i.defaults.interval,waves:i.defaults.waves,bay:'ALL'},crops:new Set(i.crops.filter(c=>c.hasSchedule).map(c=>c.id)),res:null,done:null,payload:null,busy:false,render:true,fresh:true};break}
case'genclose':if(S.gen&&!S.gen.busy)S.gen=null;break;
case'genq':S.gen=null;S.sel=null;S.queue=true;break;
case'genall':{const g=S.gen;g.init.crops.filter(gIn).forEach(c=>g.crops.add(c.id));genDirty();g.render=true;break}
case'gennone':{const g=S.gen;g.init.crops.forEach(c=>g.crops.delete(c.id));genDirty();g.render=true;break}
case'genprev':{const g=S.gen;if(g.busy)break;const p=genRead();if(!p)break;g.busy=true;genBusy('Calculating preview...');try{g.res=await api('planPreview',p);g.payload=p;g.fresh=false}finally{g.busy=false;g.render=true}break}
case'gengo':{const g=S.gen;if(g.busy||!g.res||g.res.blocked||!g.payload)break;const s=g.res.summary;if(!confirm('Write '+s.cohorts+' new cohorts for '+s.year+' to the Seasonal Planner, Cohort Production and the Assignment queue?\n'+(s.skipped?s.skipped+' that already exist will be skipped.\n':'')+'All three are saved together or not at all.'))break;
g.busy=true;genBusy('Generating...');try{g.done=await api('planGenerate',g.payload)}finally{g.busy=false;g.render=true}break}
case'vready':{if(flow(b).left){toast('Complete or override the required steps first');return}await api('verifyBedReady',{cohort:c.id});c.ver=true;toast('Bed verified ready to plant');break}
case'plant':{if(flow(b).left){toast('Complete or override the required steps first');return}const pd=el('pd').value;if(!pd){toast('Enter the date');return}if(pd>d(0)){toast('Date cannot be in the future');return}await api('recordPlanting',{cohort:c.id,date:pd});c.stage='GROWING';c.dob=pd;toast(dl(c)+' recorded');break}
case'ready':{let reason='';if(d(0)<c.hs){reason=prompt('Earliest harvest is '+c.hs+'. Written reason to verify maturity early (required):');if(!reason)break}await api('verifyReady',{cohort:c.id,reason});c.stage='HARVEST_READY';toast('Harvest maturity verified');break}

case'done':if(flow(b).left){toast('Complete or override the required steps first');return}await api('completeHarvest',{cohort:c.id});c.stage='HARVEST_COMPLETE';toast('Harvest complete');break;
case'turn':if(flow(b).left){toast('Complete or override the required steps first');return}await api('verifyTurnover',{bed:b});C.splice(C.indexOf(c),1);delete DONE[b];toast(b+' released as available');break;
case'term':{const r=prompt('Reason for terminating this cohort?');if(r){await api('terminate',{cohort:c.id,reason:r});c.stage='TERMINATED';toast('Cohort terminated')}break}
case'move':{const free=BEDS.filter(x=>x.ok&&!cohortOf(x.id)).map(x=>x.id),n=prompt('Move to which bed?\n'+free.join(', '));if(n&&free.includes(n)){await api('moveCohort',{cohort:c.id,to:n});c.bed=n;S.sel=n;toast('Moved to '+n)}else if(n)toast('Pick an available bed')}break;
case'verifybed':await api('verifyBed',{bed:b});BEDS.find(x=>x.id==b).ok=true;toast('Bed verified');break;
case'dispatch':{const base=[...S.crew],jobs=S.picked.map(q=>({act:q.act,ws:q.crew||base}));if(!jobs.length){toast('Select at least one activity');return}if(jobs.some(j=>!j.ws.length)){toast('Select workers for every activity');return}
const date=d(S.when);for(const j of jobs)for(const w of j.ws){const k={i:S.tasks.length,bed:b,act:j.act,w,date,st:'ASSIGNED'};const r=await api('dispatch',k);k.sid=r.sid;S.tasks.push(k)}S.picked=[];toast('Dispatched '+jobs.length+' activity(ies)');break}
case'dn':{const tk=S.tasks[D.i],ai=ACTS.find(a=>a.name==tk.act);let qty='';if(ai&&ai.cnt=='Yes'){qty=prompt('Quantity completed ('+(ai.unit||'units')+')');if(qty===null||qty.trim()==='')break}await api('closeTask',{sid:tk.sid,quantity:qty});S.tasks[D.i].st='DONE';(DONE[S.tasks[D.i].bed]=DONE[S.tasks[D.i].bed]||[]).push(S.tasks[D.i].act);toast('Task closed');break}case'rt':{const n=prompt('Reassign to: '+WORKERS.map(w=>w.id).join(', '));if(WORKERS.some(w=>w.id==n)){await api('reassignTask',{sid:S.tasks[D.i].sid,to:n});S.tasks[D.i].w=n;toast('Reassigned')}break}
case'res':EX.find(x=>x.id==D.i).open=false;toast('Exception resolved');break;case'addx':if(el('xt').value){EX.push({id:'EX-'+(EX.length+1),bed:b,type:el('xt').value,sev:el('xs').value,open:true,note:'Added from board'});toast('Exception added')}break;
case'appr':if(await approve(D.i))toast('Assignment approved');break;case'apprall':for(const p of [...P])await approve(p.id);toast('All assignments approved');break;
case'rej':{const r=prompt('Reason for rejecting this proposal?');if(r){await api('rejectAssignment',{cohort:D.i,reason:r});P.splice(P.findIndex(x=>x.id==D.i),1);toast('Proposal rejected')}break}}
if(!IS_DEMO&&WR.has(D.a))await load()}catch(err){toast(err.message)}
all()});

/* ---- Plan by yield (Manager only): targets -> sow/transplant dates, nursery trays, proposed beds -> printable proposal ---- */
const yF=n=>n==null?'-':Number(n).toLocaleString();
function yInit(){const g=S.gen;return g.y||(g.y={year:g.init.defaults.year,turn:g.init.yield.turnaround,over:10,cells:128,rows:[],res:null,payload:null,done:null})}
function gTabs(){const g=S.gen,t=(k,l)=>`<button class="chip ${(g.tab||'wave')==k?'on':''}" data-a="gtab" data-i="${k}">${l}</button>`;return `<div class="row noprint" style="margin:6px 0">${t('wave','Wave plan')}${t('yield','Plan by yield')}</div>`}
function yAdd(id){const g=S.gen,y=yInit(),c=g.init.yield.crops.find(x=>x.id==id);if(!c||y.rows.some(r=>r.id==id))return;y.rows.push({id,name:c.name,method:c.method,by:'season',amount:'',rate:c.rate||'',plants:c.plants||'',waves:g.init.defaults.waves,interval:c.interval,first:c.base?y.year+c.base.slice(4):''})}
function ySync(){const g=S.gen;if(!g||!g.y)return;const y=g.y;document.querySelectorAll('#ov2 [data-y]').forEach(x=>{const k=x.dataset.y,i=x.dataset.i;if(i===undefined)y[k]=x.value;else if(y.rows[+i])y.rows[+i][k]=x.value})}
function yStatus(){const g=S.gen,y=g.y,go=el('ygo');if(!go)return;go.disabled=g.busy||!(y.res&&!y.res.blocked&&y.res.summary.cohorts>0);el('yprev').disabled=g.busy||!y.rows.length;el('ypr').disabled=!y.res}
function yDirty(){const y=S.gen.y;y.res=null;y.payload=null;const r=el('yres');if(r)r.innerHTML='';const m=el('ymsg');if(m)m.textContent='Inputs changed: run Preview again.';yStatus()}
function yRead(){ySync();const y=S.gen.y,n=Number,bad=m=>{toast(m);const x=el('ymsg');if(x)x.textContent=m;return null};
if(!y.rows.length)return bad('Add at least one crop');
for(const r of y.rows){if(!(n(r.rate)>0))return bad(r.name+': enter the yield per 100-ft bed (for example 150)');if(!(n(r.amount)>0))return bad(r.name+': enter the pounds needed this season');if(!r.first)return bad(r.name+': set the first planting date under Advanced')}
return{year:n(y.year),turnaround:y.turn,overseed:y.over,cells:y.cells,remember:true,crops:y.rows.map(r=>({id:r.id,by:'season',amount:r.amount,rate:r.rate,plants:r.plants,waves:r.waves,interval:r.interval,first:r.first}))}}
const yBeds=r=>{const a=+r.amount,v=+r.rate;return a>0&&v>0?Math.ceil(a/v-1e-9):0},yBedTxt=r=>{const b=yBeds(r);return b?`<b>${b} beds</b> <span class="mu">(${yF(b*r.rate)} lb)</span>`:'<span class="mu">enter both</span>'};
function yLive(){S.gen.y.rows.forEach((r,i)=>{const c=el('yb-'+i);if(c)c.innerHTML=yBedTxt(r)})}
function drawYield(){const g=S.gen,y=yInit();if(y.done)return yDone(y.done);
const inp=(k,v,i,w,t)=>`<input data-y="${k}" ${i!==undefined?`data-i="${i}"`:''} type="${t||'number'}" value="${esc(v)}" style="width:${w||70}px">`,avail=g.init.yield.crops.filter(c=>!y.rows.some(r=>r.id==c.id));
return `<div class="row sp noprint"><b style="font-size:16px">Season planning</b><button class="btn o" data-a="genclose">Close</button></div>${gTabs()}
<div class="mu noprint">Pick a crop, enter its yield per 100-ft bed and the pounds you need this season. The planner works out how many beds that takes, spreads them over the waves and proposes beds. Change the pounds to adjust. Preview writes nothing.</div>
<div class="row noprint"><select id="y-pick"><option value="">Add a crop...</option>${avail.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} - ${esc(c.bay||'no beds')}</option>`).join('')}</select><button class="btn o" data-a="yadd">Add</button></div>
${y.rows.length?`<div style="overflow-x:auto" class="noprint"><table class="gt"><thead><tr><th>Crop</th><th>Yield (lb per 100-ft bed)</th><th>Needed this season (lb)</th><th>Beds needed</th><th></th></tr></thead><tbody>${y.rows.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${inp('rate',r.rate,i,80).replace('<input','<input placeholder="e.g. 150"')}</td><td>${inp('amount',r.amount,i,90).replace('<input','<input placeholder="e.g. 700"')}</td><td id="yb-${i}">${yBedTxt(r)}</td><td><button class="btn r" data-a="ydel" data-i="${i}">Remove</button></td></tr>`).join('')}</tbody></table></div>
<details class="noprint" style="margin-top:6px"><summary class="mu">Advanced (already filled from your wave schedule and nursery data)</summary><div class="gf"><label>Plan year${inp('year',y.year,undefined,'100%')}</label><label>Bed turnaround (days)${inp('turn',y.turn,undefined,'100%')}</label><label>Over-seeding (%)${inp('over',y.over,undefined,'100%')}</label><label>Cells per tray${inp('cells',y.cells,undefined,'100%')}</label></div>
<table class="gt"><thead><tr><th>Crop</th><th>Waves</th><th>Days apart</th><th>First planting</th><th>Plants / 100 ft</th></tr></thead><tbody>${y.rows.map((r,i)=>`<tr><td>${esc(r.name)}<div class="mu">${esc(r.method||'')}</div></td><td>${inp('waves',r.waves,i,45)}</td><td>${inp('interval',r.interval,i,45)}</td><td>${inp('first',r.first,i,135,'date')}</td><td>${inp('plants',r.plants,i,70)}</td></tr>`).join('')}</tbody></table></details>`:'<p class="mu noprint">No crops yet. Pick one above.</p>'}
<div class="row noprint"><button class="btn o" id="yprev" data-a="yprev">Preview</button><button class="btn" id="ygo" data-a="ygo" disabled>Generate</button><button class="btn o" id="ypr" data-a="yprint" disabled>Print proposal</button><span class="mu" id="ymsg" role="status">${y.res?'':'Run Preview to enable Generate.'}</span></div>
<div id="yres">${y.res?yRes(y.res):''}</div>`}
function yRes(r){const s=r.summary,k=(l,v)=>`<div><span class="mu">${l}</span><b>${esc(v)}</b></div>`,ic={error:'&#9888; ',warn:'&#9888; ',info:'&#8505; '},tr=r.plan.reduce((n,p)=>n+p.waves.reduce((m,w)=>m+(w.trays||0),0),0);
return `<div class="kpi noprint">${k('Crops',s.crops)}${k('Waves placed',s.waves)}${k('Bed feet',yF(s.ft))}${k('Target lb',s.lb?yF(s.lb):'-')}${k('Nursery trays',tr||'-')}${s.unplaced?k('No room',s.unplaced):''}</div>`+r.warnings.map(w=>`<div class="wn ${w.level} noprint">${ic[w.level]||''}${esc(w.msg)}</div>`).join('')+yProp(r)+yChart(r.chart)}
function yProp(r){const bays=Object.fromEntries(S.gen.init.bays),ps=r.plan.filter(p=>p.waves.length||p.unplaced.length);if(!ps.length)return '';const wv=ps.flatMap(p=>p.waves.map(w=>w.date)).sort();
return `<div class="card" style="margin-top:8px"><h3 style="margin:0">Ngapori Ranch Operational Production Proposal</h3><div class="mu">Plan year ${r.summary.year} - planting ${wv[0]||'-'} to ${wv[wv.length-1]||'-'}</div>`+ps.map(p=>`<div style="margin-top:8px"><b>${esc(p.name)}</b> <span class="mu">${esc(p.crop)} - facility ${esc(p.bay)} ${esc(bays[p.bay]||'')}</span>${p.askLb?`<div class="mu">Needed ${yF(p.askLb)} lb at ${p.rate} lb per 100-ft bed = ${p.seasonBeds} beds (${yF(p.seasonBeds*p.rate)} lb)</div>`:''}`+p.waves.map(w=>`<div class="card" style="margin-top:4px"><b>Wave ${w.k}</b> - ${w.transplant?'Transplanting':'Direct seeding'}<br>Beds assigned: ${w.parts.map(x=>esc(x.bed)+' ('+esc(x.seg)+', '+x.ft+' ft)').join(' &#10132; ')}<br>Sow${w.transplant?' (nursery)':''}: <b>${w.sow}</b>${w.transplant?' &nbsp; Transplant (field): <b>'+w.date+'</b>':''}<br>First harvest: ${w.hFrom} to ${w.hTo}<br>Target yield: <b>${w.lb!=null?yF(w.lb)+' lb':'not entered'}</b> from ${w.ft} ft<br>Seed/plants for ${w.seedBeds} beds-worth incl. over-seeding${w.plants?': '+yF(w.plants)+' plants':''}${w.trays?', '+w.trays+' trays':''}</div>`).join('')+p.unplaced.map(u=>`<div class="wn error">Wave ${u.date}: no room (needs ${u.need} ft, ${u.free} ft free). Not proposed.</div>`).join('')+'</div>').join('')+'</div>'}
function yChart(c){if(!c)return '';const t=s=>Date.parse(s),a=t(c.from),sp=Math.max(1,t(c.to)-a);
return `<div class="noprint" style="margin-top:8px"><b>Bed occupancy</b><div class="mu">${c.from} to ${c.to}. Green = proposed now, grey = already booked.</div>`+c.beds.map(b=>`<div style="display:flex;gap:6px;align-items:center;margin-top:3px"><span style="width:84px;font-size:11px">${esc(b.id)}</span><div style="position:relative;flex:1;height:22px;border:1px solid var(--ln);border-radius:4px;overflow:hidden">${c.bars.filter(x=>x.bed==b.id).map(x=>{const l=(Math.max(t(x.s),a)-a)/sp*100,w=(Math.min(t(x.e),a+sp)-Math.max(t(x.s),a))/sp*100,top=x.off==null?0:x.off/b.len*100,h=x.off==null?100:x.ft/b.len*100;return `<div title="${esc(x.crop+' '+x.s+' to '+x.e+', '+x.ft+' ft')}" style="position:absolute;left:${l}%;width:${w}%;top:${top}%;height:${h}%;background:${x.ex?'#9aa5a0':'var(--ac)'};opacity:.85;border-right:1px solid var(--pn)"></div>`}).join('')}</div></div>`).join('')+'</div>'}
function yDone(r){const s=r.summary;return `<div class="row sp noprint"><b style="font-size:16px">Season ${s.year} proposal saved</b><button class="btn o" data-a="genclose">Close</button></div><div class="kpi noprint"><div><span class="mu">Cohorts created</span><b>${r.created.cohorts}</b></div><div><span class="mu">Target lb</span><b>${s.lb?yF(s.lb):'-'}</b></div></div><div class="mu noprint">${esc(r.ids[0])} to ${esc(r.ids[r.ids.length-1])}. Planner, cohorts and assignment queue saved together.${r.logged?'':' The yield log could not be written.'}${r.ratesSaved?' Yields saved for next time.':''}</div>${yProp(r)}<div class="row noprint"><button class="btn" data-a="genq">Open assignment queue (${P.length})</button><button class="btn o" data-a="yprint">Print proposal</button></div>`}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]'),g=S.gen;if(!t||!g||!['gtab','yadd','ydel','yprev','ygo','yprint'].includes(t.dataset.a))return;const a=t.dataset.a;
try{if(a=='gtab'){ySync();g.tab=t.dataset.i;g.render=true}

else if(a=='ygo'){const y=g.y;if(g.busy||!y.res||y.res.blocked||!y.payload)return;if(!confirm('Write '+y.res.summary.cohorts+' cohorts for '+y.res.summary.year+' to the Seasonal Planner, Cohort Production and the Assignment queue? All three are saved together or not at all.'))return;
g.busy=true;try{y.done=await api('yieldGenerate',y.payload);try{await load()}catch(x){}}finally{g.busy=false;g.render=true}}}catch(err){toast(err.message)}all()});

/* ---- Crop profile: one record per crop (read for everyone on the board, edit for the Manager) ---- */
function cpSecs(v){const nr='<span class="mu">Not recorded</span>',t=x=>x==null||x===''?nr:esc(x),d=n=>n==null?nr:esc(n+(n==1?' day':' days')),R=(l,f,key,kind,pair)=>({l,f,key,kind,pair});
const chain=v.nurs>0?[v.germ,v.nurs,v.hard,v.est].map(x=>(x==null?'?':x)+'d').join(' → '):'Direct sow: '+(v.germ==null?'?':v.germ)+'d germination → '+(v.est==null?'?':v.est)+'d establishment';
return [
{h:'Identity',rows:[R('Crop ID',t(v.code)),R('Crop name',t(v.name)),R('Crop family',t(v.family),'family','s'),R('Production category',t(v.category),'category','s'),R('Cycle class',t(v.cycle))]},
{h:'How we start it',rows:[R('Propagation method',t(v.propMethod)),R('Planting method',t(v.plantMethod)),R('DOB type',t(v.dobType)),R('Germination',d(v.germ),'germ','n'),R('Nursery duration',d(v.nurs),'nurs','n'),R('Hardening',d(v.hard),'hard','n'),R('Transplant / field establishment',d(v.est),'est','n'),R('Total pre-DOB lead time',d(v.pre)+(v.pre!=null?' <span class="mu">(germination + nursery + hardening, recalculated on save)</span>':'')),R('Notes',t(v.propNotes),'propNotes','s')]},
{h:'Where we can produce it',rows:[R('Field / greenhouse',t(v.where)),R('Protected continuity',v.htElig?'High-tunnel eligible':'Open field only (not high-tunnel eligible)'),R('Default production block',v.block?t(v.block):'Not set','block','s'),R('Allowable planting window',t(v.window))]},
{h:'How it grows',rows:[R('Germination → nursery → hardening → establishment',esc(chain)),R('Days to first harvest',v.fhMin==null?nr:esc(v.fhMin+(v.fhMax!=null?'–'+v.fhMax:'')+' days'),null,null,['fhMin','fhMax'])]},
{h:'How we harvest it',rows:[R('Harvest window type',t(v.hwType),'hwType','s'),R('Recurring vs. single',v.recurring?'Recurring':'Single harvest'),R('Harvest type (ranch classification)',t(v.hType),'hType','s'),R('Succession / continuity notes',t(v.hNotes),'hNotes','s'),R('Days between harvests',v.hiMin==null?nr:esc(v.hiMin+(v.hiMax!=null?'–'+v.hiMax:'')+' days'),null,null,['hiMin','hiMax']),R('Planning harvest window',d(v.hwDays),'hwDays','n')]},
{h:'How the ranch operates it',rows:[R('Storage class',t(v.storage),'storage','s'),R('Irrigation profile',t(v.irrId),'irrId','s'),R('High-tunnel eligible',v.htElig?'Yes':'No'),R('Fruiting stage irrigation',t(v.irrStage),'irrStage','s'),R('Heat-stress rule',t(v.heatRule),'heatRule','s'),R('Note',t(v.irrNote),'irrNote','s')]},
{h:'Greenhouse growing notes',rows:[R('Microclimate zone',t(v.zone)),R('Optimal sowing window',t(v.sowWin)),R('Target soil temperature',t(v.soilTemp)),R('Estimated harvest window',t(v.estHarvest)),R('Horticultural notes',t(v.hortNotes))]}]}
function cpRow(r,edit,v){let val=r.f;if(edit){const ip=(k,n)=>`<input data-cp="${k}" type="${n?'number':'text'}" ${n?'min="0"':''} value="${esc(v[k]==null?'':v[k])}" style="${n?'width:80px':'width:100%'}">`;if(r.pair)val=ip(r.pair[0],1)+' to '+ip(r.pair[1],1)+' days';else if(r.key)val=ip(r.key,r.kind=='n')+(r.kind=='n'?' days':'')}return `<div class="cpr"><span class="mu">${r.l}</span><span>${val}</span></div>`}
function cpListHtml(){const c=S.cp,q=(c.q||'').trim().toLowerCase(),cur=c.v&&c.v.id;
const L=c.list.filter(x=>!q||(x.name+' '+x.id+' '+(x.cat||'')).toLowerCase().includes(q)).sort((x,y)=>(x.cat||'Other').localeCompare(y.cat||'Other')||x.name.localeCompare(y.name));
if(!L.length)return '<p class="mu" style="padding:10px 14px">'+(c.list.length?'No crops match your search.':'Loading crops...')+'</p>';
let h='',last=null;L.forEach(x=>{const g=x.cat||'Other';if(g!==last){h+=`<div class="cpg">${esc(g)}</div>`;last=g}
h+=`<button type="button" class="cpi${x.id==cur?' on':''}" data-a="cppick" data-id="${esc(x.id)}"${x.id==cur?' aria-current="true"':''}><span>${esc(x.name)}</span><span class="mu">${esc(x.id.replace(/-GH$/,''))}</span></button>`});return h}
function cpDetailHtml(){const c=S.cp,v=c.v;
if(c.busy)return '<div class="cpe">Loading crop profile...</div>';
if(!v)return '<div class="cpe">Select a crop from the list to open its profile.</div>';
return `<div class="row sp" style="align-items:flex-start"><div><button type="button" class="btn o cpback" data-a="cpback" style="margin-bottom:8px">Back to crops</button><h2 style="margin:0">${esc(v.name)}</h2><div class="mu">${esc(v.code)}${v.family?' · '+esc(v.family):''}</div></div><span class="row">${c.edit?'<button class="btn" data-a="cpsave">Save</button><button class="btn o" data-a="cpcancel">Cancel</button>':(c.canEdit?'<button class="btn o" data-a="cpedit">Edit crop</button>':'')}</span></div>${c.edit?'<div class="wn info">Editing. Total pre-DOB lead time is recalculated when you save. Fields that are formulas in the workbook cannot be changed here.</div>':''}`
+cpSecs(v).map(s=>`<div class="cph">${s.h}</div>`+s.rows.map(r=>cpRow(r,c.edit,v)).join('')).join('')
+'<p class="mu" style="margin-top:14px">The workbook does not break out a separate vegetative vs. reproductive stage. Only the pre-DOB propagation stages and total days to first harvest are tracked. Bed assignments and layout status for this crop live in Season planning and the assignment queue. This screen is the crop record, not a specific planting.</p>'}
function cpView(){const o=el('ov3'),c=S.cp;if(!o)return;o.style.display=c?'flex':'none';if(!c||!c.render)return;c.render=false;
o.firstElementChild.innerHTML=`<div class="cpt"><b style="font-size:15px">Crop profile</b><button class="btn o" data-a="cpclose">Close</button></div><div class="cpw${c.v||c.busy?' sel':''}"><div class="cpl"><input id="cp-q" type="search" placeholder="Search crops" aria-label="Search crops" autocomplete="off" value="${esc(c.q||'')}"><div id="cp-items">${cpListHtml()}</div></div><div class="cpd" id="cp-detail">${cpDetailHtml()}</div></div>`}
async function cpLoad(id){const c=S.cp;c.busy=!!id;c.render=true;if(id)cpView();const r=await api('cropProfile',id?{crop:id}:{listOnly:true});c.busy=false;c.list=r.list;c.canEdit=r.canEdit;if(id){c.v=r.profile;c.edit=false}c.render=true}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||!/^cp/.test(t.dataset.a))return;const a=t.dataset.a;
try{if(a=='cprof'){if(IS_DEMO){toast('Crop profile needs the connected workbook (demo mode has no data)');return}S.cp={list:[],v:null,canEdit:false,edit:false,render:true,q:'',busy:false};cpView();await cpLoad()}
else if(!S.cp)return;
else if(a=='cpclose')S.cp=null;
else if(a=='cppick'){if(S.cp.edit&&!confirm('Discard unsaved changes to this crop?'))return;try{await cpLoad(t.dataset.id)}catch(err){S.cp.busy=false;S.cp.render=true;throw err}const dt=el('cp-detail');setTimeout(()=>{const x=el('cp-detail');if(x)x.scrollTop=0},0)}
else if(a=='cpback'){S.cp.v=null;S.cp.edit=false;S.cp.render=true}
else if(a=='cpedit'){S.cp.edit=true;S.cp.render=true}
else if(a=='cpcancel'){S.cp.edit=false;S.cp.render=true}
else if(a=='cpsave'){const c=S.cp,f={};document.querySelectorAll('#ov3 [data-cp]').forEach(x=>{const k=x.dataset.cp,old=c.v[k]==null?'':String(c.v[k]);if(x.value.trim()!==old)f[k]=x.value.trim()});
if(!Object.keys(f).length){toast('No changes to save');c.edit=false;c.render=true}else{const r=await api('cropSave',{crop:c.v.id,f});c.v=r.profile;c.edit=false;c.render=true;toast('Crop profile saved')}}}catch(err){toast(err.message);if(S.cp&&!S.cp.list.length)S.cp=null}
cpView()});
document.addEventListener('input',e=>{if(e.target.id!='cp-q'||!S.cp)return;S.cp.q=e.target.value;const i=el('cp-items');if(i)i.innerHTML=cpListHtml()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&S.cp){S.cp=null;cpView()}});
(async()=>{if(IS_DEMO){all();return}
[BAYS,BEDS,C,P,EX,S.tasks].forEach(a=>a.length=0);
try{const sv=JSON.parse(sessionStorage.getItem('gh')||'null');if(sv){S.tok=sv.tok;S.user=sv.user}}catch(x){}
try{const u=await api('users');el('lu').innerHTML=u.users.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.role)})</option>`).join('')}catch(err){toast(err.message)}
if(S.tok){try{await load()}catch(err){toast(err.message)}}else S.needLogin=true;
all()})();
</script></body></html>
