@media(max-width:700px){.gccell{min-height:50px}.gcch,.gcmore{display:none}.gcdots{display:flex}.gcttl{min-width:0}.gctab{padding:7px 8px;border-left-width:6px}.gctab .gcsub{font-size:.76em}.gcbad{position:static;align-self:flex-start;margin-top:3px}.gcr{grid-template-columns:1fr}}

</style></head><body>
<nav><h1>Activity Assignment Board - Ngapori Ranch Greenhouse</h1><span class="pill" id="net"></span>
<button data-a="plan" id="plb">Season planning</button><button data-a="pcal" id="pcb">Production calendars</button><button data-a="cprof" id="cpb">Crop profile</button><button data-a="refresh">Refresh</button><button data-a="theme">Theme</button><button data-a="login" id="lg">Log out</button></nav>

<div class="ov" id="ov4"><div class="card" role="dialog" aria-modal="true" aria-label="Production calendars"></div></div>

<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxI5EoHK-uRAthC9-V6X1xkXaNvGJYuBmOyI4ox7xeNiTw6rmRPA6mWbw01wKzTbtw5Aw/exec';           // paste the Apps Script web app /exec URL (Code_GH.gs); blank = demo mode
const IS_DEMO=!WEB_APP_URL, TIMEOUT=20000;
const STAGE={PRE_PLANTING:'#D8CFAE',GROWING:'#8FBF8A',HARVEST_READY:'#2E7D32',HARVEST_COMPLETE:'#7C8B98',TERMINATED:'#C9C2AE'};
const QCOL={MUST_DO:'#B3261E',ATTENTION:'#C77700',ROUTINE:'#5B8FC9',PROPOSED:'#E0A526'};
const BAYS=[['GH-1','Bay 1 Cold zone','R',5],['GH-2','Bay 2 Temperate canopy','B',8],['GH-3','Bay 3 Indigenous specialty','B',8],['GH-4','Bay 4 Tropical high-wire','G',5]];
const BEDS=[];BAYS.forEach(b=>{for(let i=1;i<=b[3];i++)BEDS.push({id:`${b[0]}-${b[2]}${String(i).padStart(2,'0')}`,bay:b[0],ok:true})});
BEDS.find(b=>b.id=='GH-3-B08').ok=false;
const d=o=>{const x=new Date();x.setDate(x.getDate()+o);return x.toISOString().slice(0,10)};
const C=[['ASP-GH-2027-W01','Asparagus','GH-1-R01','GROWING',-240,730,730],['SP-GH-2027-W01','Sweet Potatoes','GH-1-R02','GROWING',-120,100,120],['CAR-GH-2027-W01','Carrots','GH-1-R04','GROWING',-35,65,80],['BRO-GH-2027-W01','Broccoli','GH-1-R05','PRE_PLANTING',5,60,80],
['LET-GH-2027-W01','Lettuce','GH-2-B01','HARVEST_READY',-50,45,60],['LET-GH-2027-W02','Lettuce','GH-2-B02','GROWING',-30,45,60],['SPI-GH-2027-W01','Spinach','GH-2-B03','PRE_PLANTING',2,35,45],['KAL-GH-2027-W01','Kale','GH-2-B04','GROWING',-40,55,75],['CHD-GH-2027-W01','Swiss Chard','GH-2-B06','HARVEST_COMPLETE',-70,45,60],
['BTL-GH-2027-W01','Bitter Leaf','GH-3-B01','GROWING',-150,60,60],['UGW-GH-2027-W01','Ugwu','GH-3-B02','GROWING',-90,60,90],['UGW-GH-2027-W02','Ugwu','GH-3-B03','HARVEST_READY',-95,60,90],['SUK-GH-2027-W01','Sukuma Wiki','GH-3-B04','GROWING',-20,50,70],
['PLN-GH-2027-W01','Plantains','GH-4-G01','GROWING',-200,365,540],['TOM-GH-2027-W01','Tomatoes','GH-4-G02','GROWING',-45,60,80],['PEP-GH-2027-W01','Peppers','GH-4-G04','TERMINATED',-60,65,75]]
.map(c=>({id:c[0],crop:c[1],bed:c[2],stage:c[3],dob:d(c[4]),hs:d(c[4]+c[5]),he:d(c[4]+c[6])}));
const P=[['ONI-GH-2027-W01','Onions','GH-1-R03',7],['TUR-GH-2027-W01','Turnips','GH-1-R03',14],['COL-GH-2027-W01','Collard Greens','GH-2-B07',9],['MUS-GH-2027-W01','Mustard Greens','GH-2-B08',12],['MCH-GH-2027-W01','Mchicha','GH-3-B05',10],['AMG-GH-2027-W01','Amaranth Grain','GH-4-G02',21],['EGG-GH-2027-W01','Eggplant','GH-4-G03',8],['HAB-GH-2027-W01','Habanero','GH-4-G05',16]]
.map(p=>({id:p[0],crop:p[1],rec:p[2],date:d(p[3])}));

const ACTS=[];   // {id,name,group,phase,req} from ACTIVITIES_REFERENCE (live); ids are Act-<Phase>-<n> (e.g. Act-Pre-Planting-4); demo seed below
if(IS_DEMO)Object.entries({'Soil & Bed Prep':['Pull plastic & drip','Bed prep & fertigation check','Install trellis'],'Crop Maintenance':['Prune & train','Scout pests','Irrigation check','Thin & weed'],'Harvest Operations':['Harvest','Grade & pack','Haul to cooler'],'Post-Harvest & Sanitation':['Clear debris','Power-wash bench or flush gutter','Verify bed ready']}).forEach(([g,l])=>l.forEach(n=>{const ph=g=='Harvest Operations'?'Harvest':g=='Post-Harvest & Sanitation'?'Post-Harvest':'Maintenance';ACTS.push({id:'Act-'+ph+'-'+(ACTS.filter(x=>x.phase==ph).length+1),name:n,group:g,phase:ph,req:g=='Post-Harvest & Sanitation'?'Yes':'No'})}));

const S={view:'stage',filt:'ALL',sel:null,tab:'Overview',net:IS_DEMO?'demo':'wait',tasks:[],cat:'ALL',user:IS_DEMO,tok:null,upd:'',err:'',crew:new Set(),picked:[],when:0,needLogin:false,queue:false,ovSet:new Set(),ovWhy:'',ovTab:'bed'};
async function api(action,payload){if(IS_DEMO)return{ok:true};const c=new AbortController(),t=setTimeout(()=>c.abort(),TIMEOUT);let j;
try{const r=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.tok,...payload}),signal:c.signal});j=await r.json()}
catch(e){S.net='offline';S.err='cannot reach web app';throw new Error('Could not reach the workbook')}finally{clearTimeout(t)}
S.net='online';S.err='';if(!j.ok){if(j.error=='Session expired'){S.tok=null;S.user=null;S.needLogin=true;try{sessionStorage.removeItem('gh')}catch(x){}}throw new Error(j.error||'Workbook rejected the change')}return j}
const WR=new Set(['gengo','vready','override','ovrow','ovapply','plant','ready','done','turn','term','move','verifybed','dispatch','dn','rt','appr','apprall','rej']);
async function load(){const r=await api('load');BAYS.length=BEDS.length=C.length=P.length=0;S.tasks.length=0;

document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]'),g=S.gen;if(!t||!g||!['gtab','yadd','ydel','yprev','ygo','yprint'].includes(t.dataset.a))return;const a=t.dataset.a;

const chain=v.nurs>0?[v.germ,v.nurs,v.hard,v.est].map(x=>(x==null?'?':x)+'d').join(' → '):'Direct sow: '+(v.germ==null?'?':v.germ)+'d germination → '+(v.est==null?'?':v.est)+'d establishment';
return [
{h:'Identity',rows:[R('Crop ID',t(v.code)),R('Crop name',t(v.name)),R('Crop family',t(v.family),'family','s'),R('Production category',t(v.category),'category','s'),R('Cycle class',t(v.cycle))]},
{h:'How we start it',rows:[R('Propagation method',t(v.propMethod)),R('Planting method',t(v.plantMethod)),R('DOB type',t(v.dobType)),R('Germination',d(v.germ),'germ','n'),R('Nursery duration',d(v.nurs),'nurs','n'),R('Hardening',d(v.hard),'hard','n'),R('Transplant / field establishment',d(v.est),'est','n'),R('Total pre-DOB lead time',d(v.pre)+(v.pre!=null?' <span class="mu">(germination + nursery + hardening, recalculated on save)</span>':'')),R('Notes',t(v.propNotes),'propNotes','s')]},
{h:'Where we can produce it',rows:[R('Field / greenhouse',t(v.where)),R('Protected continuity',v.htElig?'High-tunnel eligible':'Open field only (not high-tunnel eligible)'),R('Default production block',v.block?t(v.block):'Not set','block','s'),R('Allowable planting window',t(v.window))]},
{h:'How it grows',rows:[R('Germination → nursery → hardening → establishment',esc(chain)),R('Days to first harvest',v.fhMin==null?nr:esc(v.fhMin+(v.fhMax!=null?'–'+v.fhMax:'')+' days'),null,null,['fhMin','fhMax'])]},
{h:'How we harvest it',rows:[R('Harvest window type',t(v.hwType),'hwType','s'),R('Recurring vs. single',v.recurring?'Recurring':'Single harvest'),R('Harvest type (ranch classification)',t(v.hType),'hType','s'),R('Succession / continuity notes',t(v.hNotes),'hNotes','s'),R('Days between harvests',v.hiMin==null?nr:esc(v.hiMin+(v.hiMax!=null?'–'+v.hiMax:'')+' days'),null,null,['hiMin','hiMax']),R('Planning harvest window',d(v.hwDays),'hwDays','n')]},
{h:'How the ranch operates it',rows:[R('Storage class',t(v.storage),'storage','s'),R('Irrigation profile',t(v.irrId),'irrId','s'),R('High-tunnel eligible',v.htElig?'Yes':'No'),R('Fruiting stage irrigation',t(v.irrStage),'irrStage','s'),R('Heat-stress rule',t(v.heatRule),'heatRule','s'),R('Note',t(v.irrNote),'irrNote','s')]},
{h:'Greenhouse growing notes',rows:[R('Microclimate zone',t(v.zone)),R('Optimal sowing window',t(v.sowWin)),R('Target soil temperature',t(v.soilTemp)),R('Estimated harvest window',t(v.estHarvest)),R('Horticultural notes',t(v.hortNotes))]}]}
function cpRow(r,edit,v){let val=r.f;if(edit){const ip=(k,n)=>`<input data-cp="${k}" type="${n?'number':'text'}" ${n?'min="0"':''} value="${esc(v[k]==null?'':v[k])}" style="${n?'width:80px':'width:100%'}">`;if(r.pair)val=ip(r.pair[0],1)+' to '+ip(r.pair[1],1)+' days';else if(r.key)val=ip(r.key,r.kind=='n')+(r.kind=='n'?' days':'')}return `<div class="cpr"><span class="mu">${r.l}</span><span>${val}</span></div>`}
function cpListHtml(){const c=S.cp,q=(c.q||'').trim().toLowerCase(),cur=c.v&&c.v.id;
const L=c.list.filter(x=>!q||(x.name+' '+x.id+' '+(x.cat||'')).toLowerCase().includes(q)).sort((x,y)=>(x.cat||'Other').localeCompare(y.cat||'Other')||x.name.localeCompare(y.name));
if(!L.length)return '<p class="mu" style="padding:10px 14px">'+(c.list.length?'No crops match your search.':'Loading crops...')+'</p>';
let h='',last=null;L.forEach(x=>{const g=x.cat||'Other';if(g!==last){h+=`<div class="cpg">${esc(g)}</div>`;last=g}
h+=`<button type="button" class="cpi${x.id==cur?' on':''}" data-a="cppick" data-id="${esc(x.id)}"${x.id==cur?' aria-current="true"':''}><span>${esc(x.name)}</span><span class="mu">${esc(x.id.replace(/-GH$/,''))}</span></button>`});return h}
function cpDetailHtml(){const c=S.cp,v=c.v;
if(c.busy)return '<div class="cpe">Loading crop profile...</div>';
if(!v)return '<div class="cpe">Select a crop from the list to open its profile.</div>';
return `<div class="row sp" style="align-items:flex-start"><div><button type="button" class="btn o cpback" data-a="cpback" style="margin-bottom:8px">Back to crops</button><h2 style="margin:0">${esc(v.name)}</h2><div class="mu">${esc(v.code)}${v.family?' · '+esc(v.family):''}</div></div><span class="row">${c.edit?'<button class="btn" data-a="cpsave">Save</button><button class="btn o" data-a="cpcancel">Cancel</button>':(c.canEdit?'<button class="btn o" data-a="cpedit">Edit crop</button>':'')}</span></div>${c.edit?'<div class="wn info">Editing. Total pre-DOB lead time is recalculated when you save. Fields that are formulas in the workbook cannot be changed here.</div>':''}`
+cpSecs(v).map(s=>`<div class="cph">${s.h}</div>`+s.rows.map(r=>cpRow(r,c.edit,v)).join('')).join('')
+'<p class="mu" style="margin-top:14px">The workbook does not break out a separate vegetative vs. reproductive stage. Only the pre-DOB propagation stages and total days to first harvest are tracked. Bed assignments and layout status for this crop live in Season planning and the assignment queue. This screen is the crop record, not a specific planting.</p>'}
function cpView(){const o=el('ov3'),c=S.cp;if(!o)return;o.style.display=c?'flex':'none';if(!c||!c.render)return;c.render=false;
o.firstElementChild.innerHTML=`<div class="cpt"><b style="font-size:15px">Crop profile</b><button class="btn o" data-a="cpclose">Close</button></div><div class="cpw${c.v||c.busy?' sel':''}"><div class="cpl"><input id="cp-q" type="search" placeholder="Search crops" aria-label="Search crops" autocomplete="off" value="${esc(c.q||'')}"><div id="cp-items">${cpListHtml()}</div></div><div class="cpd" id="cp-detail">${cpDetailHtml()}</div></div>`}
async function cpLoad(id){const c=S.cp;c.busy=!!id;c.render=true;if(id)cpView();const r=await api('cropProfile',id?{crop:id}:{listOnly:true});c.busy=false;c.list=r.list;c.canEdit=r.canEdit;if(id){pcSet(r.profile);c.v=r.profile;c.edit=false}c.render=true}

else if(!S.cp)return;
else if(a=='cpclose')S.cp=null;

else if(a=='cpback'){S.cp.v=null;S.cp.edit=false;S.cp.render=true}

if(!Object.keys(f).length){toast('No changes to save');c.edit=false;c.render=true}else{const r=await api('cropSave',{crop:c.v.id,f});pcSet(r.profile);c.v=r.profile;c.edit=false;c.render=true;toast('Crop profile saved')}}}catch(err){toast(err.message);if(S.cp&&!S.cp.list.length)S.cp=null}

<script>
/* GCAL:START - shared production calendars (Propagation / Planting / Harvest). Same block lives in gh_ranch_aab.html and gh_dashboard.html. */
const GCAL=(()=>{
const CALS={
 prop:{name:'Propagation',blurb:'Nursery sowing and harden-off',c:'#2E7D32',types:['sow','harden'],main:['sow','harden']},
 plant:{name:'Planting',blurb:'Transplants out to beds, and crops that go straight into the bed (seed, slips, cuttings, crowns)',c:'#1F6FB2',types:['plant','direct'],main:['plant','direct']},
 harv:{name:'Harvest',blurb:'First-harvest windows',c:'#B3571B',types:['ready','close'],main:['ready']}};
const TY={
 sow:{l:'Sow in nursery',s:'Sow',p:'nursery sowings',c:'#2E7D32'},
 harden:{l:'Start harden-off',s:'Harden',p:'harden-offs',c:'#8F5F00'},
 plant:{l:'Plant out',s:'Plant',p:'plant-outs',c:'#1F6FB2'},
 direct:{l:'Direct to bed',s:'Direct',p:'direct plantings',c:'#5B3FA8'},
 ready:{l:'Harvest window opens',s:'Harvest',p:'windows opening',c:'#B3571B'},
 close:{l:'Harvest window closes',s:'Last day',p:'windows closing',c:'#7A3E14'}};
const ORDER=Object.keys(TY),CALKEYS=Object.keys(CALS);
const calOf=t=>CALKEYS.find(k=>CALS[k].types.includes(t));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const add=(s,n)=>{const x=new Date(s+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fmt=(s,o)=>s?new Date(s+'T00:00:00Z').toLocaleDateString('en-US',Object.assign({month:'short',day:'numeric',year:'numeric',timeZone:'UTC'},o||{})):'-';
const wkStart=s=>add(s,-new Date(s+'T00:00:00Z').getUTCDay());
const shiftM=(m,k)=>new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+k,1)).toISOString().slice(0,7);
const waveOf=e=>e.wave||((String(e.id||'').match(/W(\d+)$/)||[])[1]|0)||0;
const uniq=a=>[...new Set(a.filter(Boolean))];
const defBay=b=>String(b||'').split('-').slice(0,2).join('-');

function create(cfg){
 const st={tab:null,bay:'ALL',t:{}},today=()=>cfg.today(),bayOf=cfg.bayOf||defBay;
 let host=null,focus=null;
 const ts=k=>st.t[k]||(st.t[k]={view:'month',mon:null,day:'',range:null,off:k=='harv'?{close:true}:{}});
 const late=e=>!e.done&&(e.t=='sow'||e.t=='harden'||e.t=='plant'||e.t=='direct')&&e.d<today();
 const nowOpen=e=>e.t=='ready'&&!e.done&&e.d<=today()&&(!e.he||e.he>=today());
 const missed=e=>e.t=='ready'&&!e.done&&e.he&&e.he<today();
 const evAll=()=>(cfg.events()||[]).filter(e=>e&&e.d&&TY[e.t]&&(st.bay=='ALL'||bayOf(e.bed)==st.bay));
 const evCal=(all,k)=>all.filter(e=>calOf(e.t)==k);
 const vis=(evs,T)=>evs.filter(e=>!T.off[e.t]);
 const sorter=(a,b)=>a.d<b.d?-1:a.d>b.d?1:ORDER.indexOf(a.t)-ORDER.indexOf(b.t)||(a.crop<b.crop?-1:a.crop>b.crop?1:waveOf(a)-waveOf(b));
 function groups(evs){const m={},o=[];evs.slice().sort(sorter).forEach(e=>{const k=e.d+'|'+e.t+'|'+e.crop;if(!m[k]){m[k]=[];o.push(m[k])}m[k].push(e)});return o}

 /* ---- which range / month to open on ---- */
 function ranges(k,evs){const t=today(),r=[],o=evs.filter(late).length,n=evs.filter(nowOpen).length;
  const up=lim=>evs.filter(e=>e.d>=t&&e.d<=lim);
  if(k=='harv'&&n)r.push(['now','Open now',n]);if(k!='harv'&&o)r.push(['over','Overdue',o]);
  r.push(['14','Next 14 days',up(add(t,14)).length],['30','Next 30 days',up(add(t,30)).length],['90','Next 90 days',up(add(t,90)).length],['all','All upcoming',up('9999-12-31').length],['past','Last 30 days',evs.filter(e=>e.d<t&&e.d>=add(t,-30)).length]);return r}
 function rangeEvs(T,evs){const t=today(),r=T.range;
  if(r=='over')return evs.filter(late);if(r=='now')return evs.filter(nowOpen);
  if(r=='past')return evs.filter(e=>e.d<t&&e.d>=add(t,-30));
  const lim=r=='all'?'9999-12-31':add(t,+r);return evs.filter(e=>e.d>=t&&e.d<=lim)}
 function initTab(k,evs){const T=ts(k),t=today();
  if(!T.range){const rs=ranges(k,evs);T.range=(rs.find(x=>x[0]=='over'||x[0]=='now')||rs.find(x=>['30','90','all'].includes(x[0])&&x[2]>0)||rs[1])[0]}
  if(!T.mon){const tm=t.slice(0,7),ms=uniq(evs.map(e=>e.d.slice(0,7))).sort();T.mon=ms.includes(tm)?tm:(ms.find(m=>m>tm)||ms[ms.length-1]||tm)}
  const inM=evs.filter(e=>e.d.slice(0,7)==T.mon).map(e=>e.d).sort();
  if(!T.day||T.day.slice(0,7)!=T.mon)T.day=t.slice(0,7)==T.mon?t:(inM[0]||T.mon+'-01')}
 function pickTab(all){const t=today(),w=add(t,7);
  for(const k of CALKEYS)if(evCal(all,k).some(e=>late(e)||nowOpen(e)))return k;
  for(const k of CALKEYS)if(evCal(all,k).some(e=>!e.done&&CALS[k].main.includes(e.t)&&e.d>=t&&e.d<=w))return k;
  for(const k of CALKEYS)if(evCal(all,k).some(e=>!e.done&&e.d>=t))return k;return'prop'}

 /* ---- rendering pieces ---- */
 function tabs(all){const t=today(),w=add(t,7);
  return `<div class="gctabs" role="tablist" aria-label="Production calendars">${CALKEYS.map(k=>{const c=CALS[k],ev=evCal(all,k),main=ev.filter(e=>c.main.includes(e.t)&&!e.done),o=ev.filter(late).length,n=ev.filter(nowOpen).length,wk=main.filter(e=>e.d>=t&&e.d<=w).length,nx=main.filter(e=>e.d>=t).sort(sorter)[0];
   const sub=k=='harv'&&n?n+' open now':wk?wk+' in next 7 days':nx?'Next: '+fmt(nx.d,{year:undefined}):ev.length?'All done':'Nothing scheduled';
   return `<button class="gctab" role="tab" aria-selected="${st.tab==k}" data-g="tab" data-v="${k}" style="--tc:${c.c}"><b>${c.name}</b><span class="gcsub">${esc(sub)}</span>${o?`<i class="gcbad">${o} overdue</i>`:''}</button>`}).join('')}</div>`}
 function toolbar(k,T,evs){const c=CALS[k];
  const view=`<span class="gcseg" role="group" aria-label="View"><button data-g="view" data-v="month" class="${T.view=='month'?'on':''}" aria-pressed="${T.view=='month'}">Month</button><button data-g="view" data-v="list" class="${T.view=='list'?'on':''}" aria-pressed="${T.view=='list'}">Agenda</button></span>`;
