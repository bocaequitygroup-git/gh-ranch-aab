<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxI5EoHK-uRAthC9-V6X1xkXaNvGJYuBmOyI4ox7xeNiTw6rmRPA6mWbw01wKzTbtw5Aw/exec';           // paste the Apps Script web app /exec URL (Code_GH.gs); blank = demo mode
const IS_DEMO=!WEB_APP_URL, TIMEOUT=45000;
const STAGE={PRE_PLANTING:'#D8CFAE',GROWING:'#8FBF8A',HARVEST_READY:'#2E7D32',HARVEST_COMPLETE:'#7C8B98',TERMINATED:'#C9C2AE'};
const QCOL={MUST_DO:'#B3261E',ATTENTION:'#C77700',ROUTINE:'#5B8FC9',PROPOSED:'#E0A526'};

const BEDS=[];BAYS.forEach(b=>{for(let i=1;i<=b[3];i++)BEDS.push({id:`${b[0]}-${b[2]}${String(i).padStart(2,'0')}`,bay:b[0],ok:true})});
BEDS.find(b=>b.id=='GH-3-B08').ok=false;
const d=o=>{const x=new Date();x.setDate(x.getDate()+o);return x.toISOString().slice(0,10)};
const C=[['ASP-GH-2027-W01','Asparagus','GH-1-R01','GROWING',-240,730,730],['SP-GH-2027-W01','Sweet Potatoes','GH-1-R02','GROWING',-120,100,120],['CAR-GH-2027-W01','Carrots','GH-1-R04','GROWING',-35,65,80],['BRO-GH-2027-W01','Broccoli','GH-1-R05','PRE_PLANTING',5,60,80],
['LET-GH-2027-W01','Lettuce','GH-2-B01','HARVEST_READY',-50,45,60],['LET-GH-2027-W02','Lettuce','GH-2-B02','GROWING',-30,45,60],['SPI-GH-2027-W01','Spinach','GH-2-B03','PRE_PLANTING',2,35,45],['KAL-GH-2027-W01','Kale','GH-2-B04','GROWING',-40,55,75],['CHD-GH-2027-W01','Swiss Chard','GH-2-B06','HARVEST_COMPLETE',-70,45,60],
['BTL-GH-2027-W01','Bitter Leaf','GH-3-B01','GROWING',-150,60,60],['UGW-GH-2027-W01','Ugwu','GH-3-B02','GROWING',-90,60,90],['UGW-GH-2027-W02','Ugwu','GH-3-B03','HARVEST_READY',-95,60,90],['SUK-GH-2027-W01','Sukuma Wiki','GH-3-B04','GROWING',-20,50,70],
['PLN-GH-2027-W01','Plantains','GH-4-G01','GROWING',-200,365,540],['TOM-GH-2027-W01','Tomatoes','GH-4-G02','GROWING',-45,60,80]]
.map(c=>({id:c[0],crop:c[1],bed:c[2],stage:c[3],dob:d(c[4]),hs:d(c[4]+c[5]),he:d(c[4]+c[6])}));
const P=[['ONI-GH-2027-W01','Onions','GH-1-R03',7],['TUR-GH-2027-W01','Turnips','GH-1-R03',14],['COL-GH-2027-W01','Collard Greens','GH-2-B07',9],['MUS-GH-2027-W01','Mustard Greens','GH-2-B08',12],['MCH-GH-2027-W01','Mchicha','GH-3-B05',10],['AMG-GH-2027-W01','Amaranth Grain','GH-4-G02',21],['EGG-GH-2027-W01','Eggplant','GH-4-G03',8],['HAB-GH-2027-W01','Habanero','GH-4-G05',16]]

function yRes(r){const s=r.summary,k=(l,v)=>`<div><span class="mu">${l}</span><b>${esc(v)}</b></div>`,ic={error:'&#9888; ',warn:'&#9888; ',info:'&#8505; '},tr=r.plan.reduce((n,p)=>n+p.waves.reduce((m,w)=>m+(w.trays||0),0),0);
return `<div class="kpi noprint">${k('Crops',s.crops)}${k('Waves placed',s.waves)}${k('Bed feet',yF(s.ft))}${k('Target lb',s.lb?yF(s.lb):'-')}${k('Nursery trays',tr||'-')}${s.unplaced?k('No room',s.unplaced):''}</div>`+r.warnings.map(w=>`<div class="wn ${w.level} noprint">${ic[w.level]||''}${esc(w.msg)}</div>`).join('')+yProp(r)+yChart(r.chart)}
function yProp(r){const bays=Object.fromEntries(S.gen.init.bays),ps=r.plan.filter(p=>p.waves.length||p.unplaced.length);if(!ps.length)return '';const wv=ps.flatMap(p=>p.waves.map(w=>w.date)).sort();
return `<div class="card" style="margin-top:8px"><h3 style="margin:0">Ngapori Ranch Operational Production Proposal</h3><div class="mu">Plan year ${r.summary.year} - planting ${wv[0]||'-'} to ${wv[wv.length-1]||'-'}</div>`+ps.map(p=>`<div style="margin-top:8px"><b>${esc(p.name)}</b> <span class="mu">${esc(p.crop)} - facility ${esc(p.bay)} ${esc(bays[p.bay]||'')}</span>${p.askLb?`<div class="mu">Needed ${yF(p.askLb)} lb at ${p.rate} lb per 100-ft bed = ${p.seasonBeds} beds (${yF(p.seasonBeds*p.rate)} lb)</div>`:''}`+p.waves.map(w=>`<div class="card" style="margin-top:4px"><b>Wave ${w.k}</b> - ${w.transplant?'Transplanting':'Direct seeding'}<br>Beds assigned: ${w.parts.map(x=>esc(x.bed)+' ('+esc(x.seg)+', '+x.ft+' ft)').join(' &#10132; ')}<br>Sow${w.transplant?' (nursery)':''}: <b>${w.sow}</b>${w.transplant?' &nbsp; Transplant (field): <b>'+w.date+'</b>':''}<br>First harvest: ${w.hFrom} to ${w.hTo}<br>Target yield: <b>${w.lb!=null?yF(w.lb)+' lb':'not entered'}</b> from ${w.ft} ft<br>Seed/plants for ${w.seedBeds} beds-worth incl. over-seeding${w.plants?': '+yF(w.plants)+' plants':''}${w.trays?', '+w.trays+' trays':''}</div>`).join('')+p.unplaced.map(u=>`<div class="wn error">Wave ${u.date}: no room (needs ${u.need} ft, ${u.free} ft free). Not proposed.</div>`).join('')+'</div>').join('')+'</div>'}
function yChart(c){if(!c)return '';const t=s=>Date.parse(s),a=t(c.from),sp=Math.max(1,t(c.to)-a);
return `<div class="noprint" style="margin-top:8px"><b>Bed occupancy</b><div class="mu">${c.from} to ${c.to}. Green = proposed now, grey = already booked.</div>`+c.beds.map(b=>`<div style="display:flex;gap:6px;align-items:center;margin-top:3px"><span style="width:84px;font-size:11px">${esc(b.id)}</span><div style="position:relative;flex:1;height:22px;border:1px solid var(--ln);border-radius:4px;overflow:hidden">${c.bars.filter(x=>x.bed==b.id).map(x=>{const l=(Math.max(t(x.s),a)-a)/sp*100,w=(Math.min(t(x.e),a+sp)-Math.max(t(x.s),a))/sp*100,top=x.off==null?0:x.off/b.len*100,h=x.off==null?100:x.ft/b.len*100;return `<div title="${esc(x.crop+' '+x.s+' to '+x.e+', '+x.ft+' ft')}" style="position:absolute;left:${l}%;width:${w}%;top:${top}%;height:${h}%;background:${x.ex?'#9aa5a0':'var(--ac)'};opacity:.85;border-right:1px solid var(--pn)"></div>`}).join('')}</div></div>`).join('')+'</div>'}
function yDone(r){const s=r.summary;return `<div class="row sp noprint"><b style="font-size:16px">Season ${s.year} proposal saved</b><button class="btn o" data-a="genclose">Close</button></div><div class="kpi noprint"><div><span class="mu">Cohorts created</span><b>${r.created.cohorts}</b></div><div><span class="mu">Target lb</span><b>${s.lb?yF(s.lb):'-'}</b></div></div><div class="mu noprint">${esc(r.ids[0])} to ${esc(r.ids[r.ids.length-1])}. Planner, cohorts and assignment queue saved together.${r.logged?'':' The yield log could not be written.'}${r.ratesSaved?' Yields saved for next time.':''}</div>${yProp(r)}<div class="row noprint"><button class="btn" data-a="genq">Open assignment queue (${P.length})</button><button class="btn o" data-a="yprint">Print proposal</button></div>`}

const sfRow=()=>({crop:'',date:'',waves:'3',bpw:'',bay:''});
function sfInit(){const g=S.gen;return g.sf||(g.sf={rows:[sfRow()],reason:'',res:null,payload:null,confirm:false,done:null})}
function sfSync(){const g=S.gen;if(!g||!g.sf||!el('sf-reason'))return;const s=g.sf,v=i=>{const x=el(i);return x?x.value:''};s.rows.forEach((r,i)=>{r.crop=v('sf-crop-'+i);r.date=v('sf-date-'+i);r.waves=v('sf-waves-'+i);r.bpw=v('sf-bpw-'+i);r.bay=v('sf-bay-'+i)});s.reason=v('sf-reason');const c=el('sf-conf');if(c)s.confirm=c.checked}
function sfHint(){const g=S.gen,i=g.sfi;if(!i)return;g.sf.rows.forEach((r,k)=>{const c=i.crops.find(x=>x.id==r.crop),h=el('sf-hint-'+k);if(h)h.innerHTML=c?`Block <b>${esc(r.bay||c.bay)}</b>${r.bay?'':' (from the crop group)'} - beds ${c.beds.map(esc).join(', ')} - ${c.ftPerWave} ft per wave - ${c.interval} days apart`:''})}
function sfStatus(){const g=S.gen,s=g.sf,go=el('sfgo');if(!go)return;const r=s.res;go.disabled=g.busy||!s.rows.some(x=>x.crop);el('sfprev').disabled=g.busy||!s.rows.some(x=>x.crop);sfHint()}
function sfDirty(){const s=S.gen.sf;s.res=null;s.payload=null;s.confirm=false;const r=el('sfres');if(r)r.innerHTML='';const m=el('sfmsg');if(m)m.textContent='';sfStatus()}
function sfRead(){sfSync();const g=S.gen,s=g.sf,n=Number,bad=m=>{toast(m);const x=el('sfmsg');if(x)x.textContent=m;return null};const items=[];
for(const r of s.rows){if(!r.crop&&!r.date&&!r.bpw)continue;if(!r.crop)return bad('Pick a crop');if(!r.date)return bad('Enter the planting date');if(r.date<d(0))return bad('The planting date cannot be in the past');if(!(n(r.waves)>=1))return bad('Enter the number of waves');items.push({crop:r.crop,date:r.date,waves:n(r.waves),bedsPerWave:r.bpw===''?'':n(r.bpw),bay:r.bay})}
if(!items.length)return bad('Add a crop');return{items,reason:s.reason.trim()}}
function sfRowHtml(r,k,i){const cl=S.gen.sf.rows.length>1;return `<div class="gf noprint" style="align-items:end"><label>Crop<select id="sf-crop-${k}"><option value="">Choose crop...</option>${i.crops.map(c=>`<option value="${esc(c.id)}" ${r.crop==c.id?'selected':''}>${esc(c.name)} (${esc(c.id.replace(/-GH$/,''))})</option>`).join('')}</select></label>
<label>Planting date<input id="sf-date-${k}" type="date" min="${esc(i.today)}" value="${esc(r.date)}"></label>
<label>Waves<input id="sf-waves-${k}" type="number" min="1" max="${i.maxWaves}" value="${esc(r.waves)}"></label>
<label>Beds/wave <span class="mu">(optional)</span><input id="sf-bpw-${k}" type="number" min="1" max="20" placeholder="plan" value="${esc(r.bpw)}"></label>
<label>Block<select id="sf-bay-${k}"><option value="">Auto (crop group)</option>${i.bays.map(b=>`<option value="${esc(b[0])}" ${r.bay==b[0]?'selected':''}>${esc(b[0])} - ${esc(b[1])}</option>`).join('')}</select></label>
${cl?`<button class="btn o" data-a="sfdel" data-i="${k}" aria-label="Remove crop">&#10005;</button>`:''}</div><div class="mu noprint" id="sf-hint-${k}"></div>`}
function drawShort(){const g=S.gen,s=sfInit();
if(s.done)return sfDone(s.done);
const head=`<div class="row sp noprint"><b style="font-size:16px">Season planning</b><button class="btn o" data-a="genclose">Close</button></div>${gTabs()}`;
if(!g.sfi){if(!g.sfLoading&&!g.sfErr){g.sfLoading=true;api('shortfallInit').then(r=>{g.sfi=r;g.sfLoading=false;g.render=true;all()}).catch(e=>{g.sfLoading=false;g.sfErr=e.message;g.render=true;all()})}
return head+(g.sfErr?`<div class="wn error">${esc(g.sfErr)}</div><button class="btn o" data-a="sfretry">Try again</button>`:'<p class="mu">Loading crops...</p>')}

${s.rows.map((r,k)=>sfRowHtml(r,k,i)).join('')}

<div class="row noprint"><button class="btn" id="sfgo" data-a="sfgo">Add crop</button><button class="btn o" id="sfprev" data-a="sfprev">Preview beds only</button><button class="btn o" data-a="genclose">Cancel</button><span class="mu" id="sfmsg" role="status" aria-live="polite"></span></div>
<div id="sfres">${s.res?sfRes(s.res):''}</div>`}
function sfRes(r){const m=r.summary,k=(l,v)=>`<div><span class="mu">${l}</span><b>${esc(v)}</b></div>`;
const st={PLACED:'<span class="opchip ok">Placed</span>',NOROOM:'<span class="opchip bad">No room</span>',DUP:'<span class="opchip na">Already planned</span>'};

+r.warnings.filter(w=>w.code!='NO_RATE').map(w=>`<div class="wn ${w.level} noprint">${w.level=='info'?'&#8505; ':'&#9888; '}${esc(w.msg)}</div>`).join('')
+r.crops.map(c=>`<div class="wn info noprint"><b>${esc(c.name)}</b>: block ${esc(c.bay)}, designated beds ${c.beds.map(esc).join(', ')}; ${c.ftPerWave} ft per wave (${esc(c.ftSource)}); ${c.interval} days apart (${esc(c.intervalSource)}).</div>
<div style="overflow-x:auto" class="noprint"><table class="gt" style="margin-top:4px"><thead><tr><th>Wave</th><th>Sow</th><th>Planting date</th><th>Result</th><th>Beds</th><th>First harvest</th></tr></thead><tbody>${c.waves.map(w=>`<tr><td>${w.n}</td><td>${w.status=='PLACED'?esc(w.sow):''}</td><td>${esc(w.date)}</td><td>${st[w.status]||''}</td><td>${w.status=='PLACED'?w.parts.map(p=>esc(p.bed)+' <span class="mu">'+esc(p.seg)+'</span>').join(', '):'<span class="mu">'+esc(w.note||'-')+'</span>'}</td><td>${w.status=='PLACED'?esc(w.harvestFrom)+' to '+esc(w.harvestTo):''}</td></tr>`).join('')}</tbody></table></div>`).join('')
}
function sfDone(r){const m=r.summary;return `<div class="row sp noprint"><b style="font-size:16px">Shortfall added</b><button class="btn o" data-a="genclose">Close</button></div><div class="kpi noprint"><div><span class="mu">Cohorts created</span><b>${r.created.cohorts}</b></div><div><span class="mu">Crops</span><b>${r.crops.map(c=>esc(c.name)).join(', ')}</b></div></div>
${(r.warnings||[]).filter(w=>w.code=='BED_FORMULA').map(w=>`<div class="wn warn noprint">&#9888; ${esc(w.msg)}</div>`).join('')}<div class="wn info noprint">&#10003; Saved ${r.created.cohorts} cohort${r.created.cohorts>1?'s':''} to SEASONAL_PLANNER, COHORT_PRODUCTION and BED_ASSIGNMENT.</div>${r.crops.map(c=>`<div style="overflow-x:auto" class="noprint"><table class="gt" style="margin-top:4px"><thead><tr><th>${esc(c.name)} wave</th><th>Cohort</th><th>Sow</th><th>Planting date</th><th>Bed</th><th>First harvest</th></tr></thead><tbody>${c.waves.filter(w=>w.status=='PLACED').map(w=>`<tr><td>${w.n}</td><td>${w.parts.map(p=>esc(p.id)).join(', ')}</td><td>${esc(w.sow)}</td><td>${esc(w.date)}</td><td>${w.parts.map(p=>esc(p.bed)+' <span class="mu">'+esc(p.seg)+'</span>').join(', ')}</td><td>${esc(w.harvestFrom)} to ${esc(w.harvestTo)}</td></tr>`).join('')}</tbody></table></div>`).join('')}<div class="mu noprint">${r.ids.map(esc).join(', ')}. Planner, cohorts and bed assignments saved together. Each cohort is in pre-planting with its bed reserved and carries the red Shortfall tag. Verify the bed ready, then record planting as usual.</div>
${r.crops.map(c=>c.waves.filter(w=>w.status!='PLACED').map(w=>`<div class="wn error noprint">${esc(c.name)} wave ${w.n} (${esc(w.date)}) was not created: ${esc(w.note)}</div>`).join('')).join('')}<div class="row noprint"><button class="btn o" data-a="sfagain">Add another</button></div>`}

try{if(a=='sfretry'){g.sfErr='';g.render=true}
else if(a=='sfagain'){g.sf=null;g.render=true}
else if(a=='sfadd'){sfSync();g.sf.rows.push(sfRow());sfDirty();g.render=true}

else if(a=='sfgo'){if(g.busy)return;const s=g.sf,p0=sfRead();if(!p0)return;p0.reason=s.reason.trim();const m=el('sfmsg'),go=el('sfgo'),say=x=>{if(m)m.innerHTML='<span class="spin"></span> '+x};

s.done=await api('shortfallCreate',Object.assign({},p0,{confirmWindow:true}));

catch(err){if(m)m.textContent='Not added: '+err.message;throw err}
finally{g.busy=false;g.render=true}}}catch(err){toast(err.message)}all()});

function bpShift(s,k){if(!k||!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return s;const p=s.split('-').map(Number),last=new Date(Date.UTC(p[0]+k,p[1],0)).getUTCDate();return String(p[0]+k)+'-'+String(p[1]).padStart(2,'0')+'-'+String(Math.min(p[2],last)).padStart(2,'0')}
const bpBay=()=>{const bp=S.gen.bp;return bp.init.bays.find(b=>b.id==bp.bay)||{id:bp.bay,name:'',beds:[]}};
const bpKey=(b,c,d)=>b+'|'+c+'|'+d;
function bpCropOpts(sel){const bp=S.gen.bp;return '<option value="">— empty —</option>'+bp.init.crops.map(c=>`<option value="${esc(c.id)}" ${c.id==sel?'selected':''}>${esc(c.name)}${c.type=='PERMANENT'?' (permanent)':''}</option>`).join('')}
async function bpLoadCur(){const bp=S.gen.bp,y=bp.year,b=bp.bay,r=await api('bedPlanLoad',{year:y,bay:b});if(bp.year==y&&bp.bay==b)bp.cur=r.beds||{}}
async function bpCopy(srcBay,srcYear){const bp=S.gen.bp,same=srcBay==bp.bay&&srcYear==bp.year,r=same?{beds:bp.cur}:await api('bedPlanLoad',{year:srcYear,bay:srcBay}),
src=bp.init.bays.find(b=>b.id==srcBay),k=bp.year-srcYear;bp.rows={};let n=0,perm=0,multi=0;
(src?src.beds:[]).forEach(b=>{const its=((r.beds||{})[b.id]||[]).filter(x=>{if(x.type=='PERMANENT'&&!same){perm++;return false}return true});if(!its.length)return;n++;if(its.length>1)multi++;bp.rows[b.no]=its.map(x=>({crop:x.crop,date:same?x.date:bpShift(x.date,k)}))});

else if(a=='bpbay'){if(t.dataset.i==bp.bay)return;bp.bay=t.dataset.i;await bpRetarget()}

function cpView(){const o=el('ov3'),c=S.cp;if(!o)return;o.style.display=c?'flex':'none';if(!c||!c.render)return;c.render=false;
o.firstElementChild.innerHTML=`<div class="cpt"><b style="font-size:15px">Crop profile</b><button class="btn o" data-a="cpclose">Close</button></div><div class="cpw${c.v||c.busy?' sel':''}"><div class="cpl"><input id="cp-q" type="search" placeholder="Search crops" aria-label="Search crops" autocomplete="off" value="${esc(c.q||'')}"><div id="cp-items">${cpListHtml()}</div></div><div class="cpd" id="cp-detail">${cpDetailHtml()}</div></div>`}
async function cpLoad(id){const c=S.cp;c.busy=!!id;c.render=true;if(id)cpView();const r=await api('cropProfile',id?{crop:id}:{listOnly:true});c.busy=false;c.list=r.list;c.canEdit=r.canEdit;if(id){pcSet(r.profile);c.v=r.profile;c.edit=false}c.render=true}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||!/^cp/.test(t.dataset.a))return;const a=t.dataset.a;
try{if(a=='cprof'){if(IS_DEMO){toast('Crop profile needs the connected workbook (demo mode has no data)');return}S.cp={list:[],v:null,canEdit:false,edit:false,render:true,q:'',busy:false};cpView();await cpLoad()}
else if(!S.cp)return;
else if(a=='cpclose')S.cp=null;
else if(a=='cppick'){if(S.cp.edit&&!confirm('Discard unsaved changes to this crop?'))return;try{await cpLoad(t.dataset.id)}catch(err){S.cp.busy=false;S.cp.render=true;throw err}const dt=el('cp-detail');setTimeout(()=>{const x=el('cp-detail');if(x)x.scrollTop=0},0)}
else if(a=='cpback'){S.cp.v=null;S.cp.edit=false;S.cp.render=true}
else if(a=='cpedit'){S.cp.edit=true;S.cp.render=true}
else if(a=='cpcancel'){S.cp.edit=false;S.cp.render=true}
else if(a=='cpsave'){const c=S.cp,f={};document.querySelectorAll('#ov3 [data-cp]').forEach(x=>{const k=x.dataset.cp,old=c.v[k]==null?'':String(c.v[k]);if(x.value.trim()!==old)f[k]=x.value.trim()});
if(!Object.keys(f).length){toast('No changes to save');c.edit=false;c.render=true}else{const r=await api('cropSave',{crop:c.v.id,f});pcSet(r.profile);c.v=r.profile;c.edit=false;c.render=true;toast('Crop profile saved')}}}catch(err){toast(err.message);if(S.cp&&!S.cp.list.length)S.cp=null}
cpView()});
document.addEventListener('input',e=>{if(e.target.id!='cp-q'||!S.cp)return;S.cp.q=e.target.value;const i=el('cp-items');if(i)i.innerHTML=cpListHtml()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&S.cp){S.cp=null;cpView()}});
(async()=>{if(IS_DEMO){all();return}
[BAYS,BEDS,C,P,EX,S.tasks].forEach(a=>a.length=0);
try{const sv=JSON.parse(sessionStorage.getItem('gh')||'null');if(sv){S.tok=sv.tok;S.user=sv.user}}catch(x){}
try{const u=await api('users');el('lu').innerHTML=u.users.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.role)})</option>`).join('')}catch(err){toast(err.message)}
if(S.tok){try{await load()}catch(err){toast(err.message)}}else S.needLogin=true;
all()})();
</script>
<script>
/* GCAL:START - shared production calendars (Propagation / Planting / Harvest). Same block lives in gh_ranch_aab.html and gh_dashboard.html. */
const GCAL=(()=>{
const CALS={
 prop:{name:'Propagation',blurb:'Nursery sowing and harden-off',c:'#2E7D32',types:['sow','harden'],main:['sow','harden']},
 plant:{name:'Planting',blurb:'Transplants out to beds, and crops that go straight into the bed (seed, slips, cuttings, crowns)',c:'#1F6FB2',types:['plant','direct'],main:['plant','direct']},
 harv:{name:'Harvest',blurb:'First-harvest windows',c:'#B3571B',types:['ready','close'],main:['ready']}};
const TY={
 sow:{l:'Sow in nursery',s:'Sow',p:'nursery sowings',c:'#2E7D32'},
 harden:{l:'Start harden-off',s:'Harden',p:'harden-offs',c:'#8F5F00'},
 plant:{l:'Plant out',s:'Plant',p:'plant-outs',c:'#1F6FB2'},
 direct:{l:'Direct to bed',s:'Direct',p:'direct plantings',c:'#5B3FA8'},
 ready:{l:'Harvest window opens',s:'Harvest',p:'windows opening',c:'#B3571B'},
 close:{l:'Harvest window closes',s:'Last day',p:'windows closing',c:'#7A3E14'}};
const ORDER=Object.keys(TY),CALKEYS=Object.keys(CALS);
const calOf=t=>CALKEYS.find(k=>CALS[k].types.includes(t));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const add=(s,n)=>{const x=new Date(s+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fmt=(s,o)=>s?new Date(s+'T00:00:00Z').toLocaleDateString('en-US',Object.assign({month:'short',day:'numeric',year:'numeric',timeZone:'UTC'},o||{})):'-';
const wkStart=s=>add(s,-new Date(s+'T00:00:00Z').getUTCDay());
const shiftM=(m,k)=>new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+k,1)).toISOString().slice(0,7);
const waveOf=e=>e.wave||((String(e.id||'').match(/W(\d+)$/)||[])[1]|0)||0;
const uniq=a=>[...new Set(a.filter(Boolean))];
const defBay=b=>String(b||'').split('-').slice(0,2).join('-');

function create(cfg){
 const st={tab:null,bay:'ALL',t:{}},today=()=>cfg.today(),bayOf=cfg.bayOf||defBay;
 let host=null,focus=null;
 const ts=k=>st.t[k]||(st.t[k]={view:'month',mon:null,day:'',range:null,off:k=='harv'?{close:true}:{}});
 const late=e=>!e.done&&!e.src&&(e.t=='sow'||e.t=='harden'||e.t=='plant'||e.t=='direct')&&e.d<today();
 const nowOpen=e=>e.t=='ready'&&!e.done&&e.d<=today()&&(!e.he||e.he>=today());
 const missed=e=>e.t=='ready'&&!e.done&&!e.src&&e.he&&e.he<today();
 const evAll=()=>(cfg.events()||[]).filter(e=>e&&e.d&&TY[e.t]&&(st.bay=='ALL'||e.src||bayOf(e.bed)==st.bay));
 const evCal=(all,k)=>all.filter(e=>calOf(e.t)==k);
 const vis=(evs,T)=>evs.filter(e=>!T.off[e.t]);
 const sorter=(a,b)=>a.d<b.d?-1:a.d>b.d?1:ORDER.indexOf(a.t)-ORDER.indexOf(b.t)||(a.crop<b.crop?-1:a.crop>b.crop?1:waveOf(a)-waveOf(b));
 function groups(evs){const m={},o=[];evs.slice().sort(sorter).forEach(e=>{const k=e.d+'|'+e.t+'|'+e.crop;if(!m[k]){m[k]=[];o.push(m[k])}m[k].push(e)});return o}

 /* ---- which range / month to open on ---- */
 function ranges(k,evs){const t=today(),r=[],o=evs.filter(late).length,n=evs.filter(nowOpen).length;
  const up=lim=>evs.filter(e=>e.d>=t&&e.d<=lim);
  if(k=='harv'&&n)r.push(['now','Open now',n]);if(k!='harv'&&o)r.push(['over','Overdue',o]);
  r.push(['14','Next 14 days',up(add(t,14)).length],['30','Next 30 days',up(add(t,30)).length],['90','Next 90 days',up(add(t,90)).length],['all','All upcoming',up('9999-12-31').length],['past','Last 30 days',evs.filter(e=>e.d<t&&e.d>=add(t,-30)).length]);return r}
 function rangeEvs(T,evs){const t=today(),r=T.range;
  if(r=='over')return evs.filter(late);if(r=='now')return evs.filter(nowOpen);
  if(r=='past')return evs.filter(e=>e.d<t&&e.d>=add(t,-30));
  const lim=r=='all'?'9999-12-31':add(t,+r);return evs.filter(e=>e.d>=t&&e.d<=lim)}
 function initTab(k,evs){const T=ts(k),t=today();
  if(!T.range){const rs=ranges(k,evs);T.range=(rs.find(x=>x[0]=='over'||x[0]=='now')||rs.find(x=>['30','90','all'].includes(x[0])&&x[2]>0)||rs[1])[0]}
  if(!T.mon){const tm=t.slice(0,7),ms=uniq(evs.map(e=>e.d.slice(0,7))).sort();T.mon=ms.includes(tm)?tm:(ms.find(m=>m>tm)||ms[ms.length-1]||tm)}
  const inM=evs.filter(e=>e.d.slice(0,7)==T.mon).map(e=>e.d).sort();
  if(!T.day||T.day.slice(0,7)!=T.mon)T.day=t.slice(0,7)==T.mon?t:(inM[0]||T.mon+'-01')}
 function pickTab(all){const t=today(),w=add(t,7);
  for(const k of CALKEYS)if(evCal(all,k).some(e=>late(e)||nowOpen(e)))return k;
  for(const k of CALKEYS)if(evCal(all,k).some(e=>!e.done&&CALS[k].main.includes(e.t)&&e.d>=t&&e.d<=w))return k;
  for(const k of CALKEYS)if(evCal(all,k).some(e=>!e.done&&e.d>=t))return k;return'prop'}

 /* ---- rendering pieces ---- */
 function tabs(all){const t=today(),w=add(t,7);
  return `<div class="gctabs" role="tablist" aria-label="Production calendars">${CALKEYS.map(k=>{const c=CALS[k],ev=evCal(all,k),main=ev.filter(e=>c.main.includes(e.t)&&!e.done),o=ev.filter(late).length,n=ev.filter(nowOpen).length,wk=main.filter(e=>e.d>=t&&e.d<=w).length,nx=main.filter(e=>e.d>=t).sort(sorter)[0];
   const sub=k=='harv'&&n?n+' open now':wk?wk+' in next 7 days':nx?'Next: '+fmt(nx.d,{year:undefined}):ev.length?'All done':'Nothing scheduled';
   return `<button class="gctab" role="tab" aria-selected="${st.tab==k}" data-g="tab" data-v="${k}" style="--tc:${c.c}"><b>${c.name}</b><span class="gcsub">${esc(sub)}</span>${o?`<i class="gcbad">${o} overdue</i>`:''}</button>`}).join('')}</div>`}
 function toolbar(k,T,evs){const c=CALS[k];
  const view=`<span class="gcseg" role="group" aria-label="View"><button data-g="view" data-v="month" class="${T.view=='month'?'on':''}" aria-pressed="${T.view=='month'}">Month</button><button data-g="view" data-v="list" class="${T.view=='list'?'on':''}" aria-pressed="${T.view=='list'}">Agenda</button></span>`;
  const chips=c.types.map(t=>`<button class="gcchip ${T.off[t]?'':'on'}" data-g="ty" data-v="${t}" aria-pressed="${!T.off[t]}" style="${T.off[t]?'':`background:${TY[t].c}`}">${TY[t].l}</button>`).join('');
  const bl=typeof cfg.bays=='function'?cfg.bays():cfg.bays,bays=bl&&bl.length>1?`<select class="gcsel" id="gc-bay" aria-label="Bay"><option value="ALL">All bays</option>${bl.map(b=>`<option value="${esc(b[0])}" ${st.bay==b[0]?'selected':''}>${esc(b[1])}</option>`).join('')}</select>`:'';
  return `<div class="gctb">${view}${chips}${bays}<span class="gcsp"></span><button class="gcbtn" data-g="csv">Download CSV</button>${cfg.print?'<button class="gcbtn" data-g="print">Print</button>':''}</div>`}
 function banners(k,evs,T){let h='';
  if(k=='harv'&&cfg.perMonth&&T&&cfg.span){const sp=cfg.span(),need=cfg.perMonth;
   if(sp&&T.mon>=sp[0]&&T.mon<=sp[1]){const cnt={},crops=uniq(evs.filter(e=>e.t=='ready').map(e=>e.crop));evs.forEach(e=>{if(e.t=='ready'&&e.d.slice(0,7)==T.mon)cnt[e.crop]=(cnt[e.crop]||0)+1});
    const low=crops.filter(c=>(cnt[c]||0)<need).sort(),mn=fmt(T.mon+'-01',{month:'long',year:'numeric',day:undefined});
    h+=low.length?`<div class="gcbn bad"><span><b>${low.length}</b> of ${crops.length} crops have fewer than ${need} harvests in ${mn}: ${low.slice(0,14).map(c=>esc(c)+' ('+(cnt[c]||0)+')').join(', ')}${low.length>14?' +'+(low.length-14)+' more':''}.</span></div>`:`<div class="gcbn ok"><span>All ${crops.length} crops have ${need} or more harvests in ${mn}.</span></div>`}}const o=evs.filter(late).length,n=evs.filter(nowOpen).length,m=evs.filter(missed).length;
  if(o)h+=`<div class="gcbn bad"><span><b>${o}</b> ${k=='prop'?'nursery task'+(o==1?' is':'s are'):'planting'+(o==1?' is':'s are')} overdue.</span><button class="gcbtn" data-g="goto" data-v="over">Show overdue</button></div>`;
  if(n)h+=`<div class="gcbn ok"><span><b>${n}</b> cohort${n==1?' is':'s are'} inside the harvest window right now.</span><button class="gcbtn" data-g="goto" data-v="now">Show open now</button></div>`;
  if(m)h+=`<div class="gcbn bad"><span><b>${m}</b> cohort${m==1?' has':'s have'} passed the end of the harvest window without being marked complete.</span></div>`;
  return h}
 const flags=e=>(late(e)?'<span class="gctag" style="background:#B3261E">Overdue</span>':'')+(nowOpen(e)?'<span class="gctag" style="background:#2E7D32">Open now</span>':'')+(missed(e)?'<span class="gctag" style="background:#B3261E">Window passed</span>':'')+(e.done&&!missed(e)?'<span class="gctag" style="background:#7C8B98">Done</span>':'')+(e.proposed?'<span class="gctag" style="background:#E0A526;color:#12201a">Proposed</span>':'');
 function meta(e){const bed=e.src?esc(e.src):e.bed?'Bed '+esc(e.bed):'Bed TBD',p=[];
  if(e.t=='sow'){p.push('plant out '+fmt(e.dob));if(e.hard&&e.hard!=e.dob)p.push('harden-off '+fmt(e.hard))}
  else if(e.t=='harden'){p.push('plant out '+fmt(e.dob));if(e.sow)p.push('sown '+fmt(e.sow))}
  else if(e.t=='plant'){p.push(e.sow?'sown in nursery '+fmt(e.sow):'');if(e.hs)p.push('harvest opens '+fmt(e.hs))}
  else if(e.t=='direct'){p.push('no nursery');if(e.hs)p.push('harvest opens '+fmt(e.hs))}
  else if(e.src){p.push('planting '+fmt(e.dob)+' ('+e.days+' days to first harvest)')}
  else{p.push('window '+fmt(e.hs)+(e.he&&e.he!=e.hs?' to '+fmt(e.he):''));p.push((e.done?'planted ':'planting ')+fmt(e.dob))}
  return [bed].concat(p.filter(Boolean)).join(' &middot; ')}
 function row(g,exp,showDate){const e=g[0],n=g.length,ws=uniq(g.map(x=>waveOf(x)?'W'+waveOf(x):'')),beds=uniq(g.map(x=>x.bed));
  const who=`<b>${esc(e.crop)}</b>${n==1?(ws[0]?' '+ws[0]:''):' <span class="gcx">&times;'+n+(ws.length?' ('+ws.join(', ')+')':'')+'</span>'}`;
  const m=n==1?esc(e.id)+' &middot; '+meta(e):(beds.length?'Beds: '+esc(beds.slice(0,6).join(', '))+(beds.length>6?' +'+(beds.length-6)+' more':''):'Beds TBD')+(exp?'':' &middot; open the day for details');
  const sub=exp&&n>1?g.map(x=>`<div class="gcm">${esc(x.id)} &middot; ${meta(x)}</div>`).join(''):'';
  return `<div class="gcr${showDate?'':' nd'}">${showDate?`<div class="gcrd"><b>${fmt(e.d,{weekday:'short',month:'short',day:'numeric',year:undefined})}</b><span>${e.d.slice(0,4)}</span></div>`:''}<div><span class="gctag" style="background:${TY[e.t].c}">${TY[e.t].l}</span>${who} ${flags(e)}<div class="gcm">${m}</div>${sub}</div></div>`}

 /* ---- month view ---- */
 function month(k,T,evs,all){const f=vis(evs,T),by={};f.forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  const y=+T.mon.slice(0,4),mo=+T.mon.slice(5,7)-1,first=new Date(Date.UTC(y,mo,1)),lead=first.getUTCDay(),dim=new Date(Date.UTC(y,mo+1,0)).getUTCDate(),weeks=Math.ceil((lead+dim)/7),t=today();
  const title=first.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'}),inM=f.filter(e=>e.d.slice(0,7)==T.mon);
  const sum=CALS[k].types.filter(x=>!T.off[x]).map(x=>{const n=inM.filter(e=>e.t==x).length;return n+' '+TY[x].p}).join(' &middot; ');
  let h=`<div class="gcnav"><div class="gcrow"><button class="gcbtn" data-g="prev" aria-label="Previous month">&lsaquo;</button><b class="gcttl" aria-live="polite">${title}</b><button class="gcbtn" data-g="next" aria-label="Next month">&rsaquo;</button><button class="gcbtn" data-g="today">Today</button><input type="month" class="gcsel" id="gc-mon" value="${T.mon}" aria-label="Jump to month"></div><div class="gcmu">${sum}</div></div>`;
  h+=`<div class="gcg" role="grid" aria-label="${title}">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="gcgh" role="columnheader">${x}</div>`).join('')}`;
  for(let i=0;i<weeks*7;i++){const n=i-lead+1;if(n<1||n>dim){h+='<div class="gccell out"></div>';continue}
   const ds=T.mon+'-'+String(n).padStart(2,'0'),gs=groups(by[ds]||[]),cnt=(by[ds]||[]).length;
   h+=`<button class="gccell${ds==t?' today':''}${ds==T.day?' sel':''}" data-g="day" data-v="${ds}" role="gridcell" aria-label="${fmt(ds)}, ${cnt} event${cnt==1?'':'s'}"><span class="gcn">${n}</span>${gs.slice(0,2).map(g=>{const e=g[0],lt=g.some(late),dn=g.every(x=>x.done);return `<span class="gcch${lt?' late':''}${dn?' done':''}" style="background:${TY[e.t].c}">${lt?'! ':''}${TY[e.t].s} ${esc(e.crop)}${g.length>1?' &times;'+g.length:waveOf(e)?' W'+waveOf(e):''}</span>`}).join('')}${gs.length>2?`<span class="gcmore">+${gs.length-2} more</span>`:''}<span class="gcdots">${gs.slice(0,6).map(g=>`<i style="background:${TY[g[0].t].c}"></i>`).join('')}</span></button>`}
  h+='</div>';
  const de=groups(by[T.day]||[]);
  h+=`<div class="gcdet"><b>${fmt(T.day,{weekday:'long'})}</b>${T.day==t?' <span class="gctag" style="background:#2E7D32">Today</span>':''}${de.length?de.map(g=>row(g,true,false)).join(''):'<div class="gcm" style="margin-top:6px">Nothing scheduled on this day.</div>'}</div>`;
  return h}

 /* ---- agenda view ---- */
 function agenda(k,T,evs){const rs=ranges(k,evs);if(!rs.some(x=>x[0]==T.range))T.range=rs[1][0];
  const chips=rs.map(r=>`<button class="gcchip ${T.range==r[0]?'on':''}" data-g="range" data-v="${r[0]}" aria-pressed="${T.range==r[0]}" style="${T.range==r[0]?`background:${CALS[k].c}`:''}">${r[1]} (${r[2]})</button>`).join('');
  const list=rangeEvs(T,vis(evs,T));let wk='',h='';
  groups(list).forEach(g=>{const w=wkStart(g[0].d);if(w!=wk){wk=w;h+=`<div class="gcwk">Week of ${fmt(w)}</div>`}h+=row(g,false,true)});
  return `<div class="gctb">${chips}</div>`+(h||'<div class="gcem">Nothing in this range. Try <b>All upcoming</b>.</div>')}

 function render(){if(!host)return;const all=evAll();
  if(!all.length){host.innerHTML=`<div class="gcal"><div class="gcem">No dated cohorts yet. Calendars fill in as soon as planting dates are available.</div></div>`;return}
  if(!st.tab)st.tab=pickTab(all);const k=st.tab,T=ts(k),evs=evCal(all,k);initTab(k,evs);
  let body;try{body=banners(k,evs,T)+(T.view=='month'?month(k,T,evs,all):agenda(k,T,evs))}catch(err){console.error(err);body=`<div class="gcbn bad">The calendar could not be drawn: ${esc(err.message)}</div>`}
  host.innerHTML=`<div class="gcal" style="--tc:${CALS[k].c}">${tabs(all)}<div class="gcblurb">${esc(CALS[k].blurb)}</div>${toolbar(k,T,evs)}${body}${cfg.note?`<div class="gcnote">${cfg.note()}</div>`:''}</div>`;
  if(focus){const q=focus.id?'#'+focus.id:'[data-g="'+focus.a+'"]'+(focus.v?'[data-v="'+focus.v+'"]':''),n=host.querySelector(q);if(n)try{n.focus({preventScroll:true})}catch(e){}focus=null}}

 function csv(){const all=evAll(),k=st.tab||'prop',q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=evCal(all,k).slice().sort(sorter);
  const lines=[['Calendar','Date','Event','Crop','Wave','Cohort','Bed','Status'].map(q).join(',')];
  rows.forEach(e=>lines.push([CALS[k].name,e.d,TY[e.t].l,e.crop,waveOf(e)||'',e.id,e.bed,late(e)?'Overdue':nowOpen(e)?'Open now':e.done?'Done':e.proposed?'Proposed':'Scheduled'].map(q).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download=CALS[k].name.toLowerCase()+'_calendar_'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

 function onClick(ev){const n=ev.target.closest('[data-g]');if(!n||!host||!host.contains(n))return;const a=n.dataset.g,v=n.dataset.v;
  if(a=='csv'){csv();return}if(a=='print'){window.print();return}
  const k=st.tab,T=ts(k);focus={a,v};
  if(a=='tab'){st.tab=v}else if(a=='view'){T.view=v}else if(a=='ty'){T.off[v]=!T.off[v]}
  else if(a=='prev'){T.mon=shiftM(T.mon,-1);T.day=''}else if(a=='next'){T.mon=shiftM(T.mon,1);T.day=''}
  else if(a=='today'){T.mon=today().slice(0,7);T.day=today()}else if(a=='day'){T.day=v}
  else if(a=='range'){T.range=v}else if(a=='goto'){T.view='list';T.range=v;focus=null}
  render()}

function lhGroup(L,k1,k2){const g={};L.forEach(r=>{const a=g[r[k1]]=g[r[k1]]||{key:r[k1],name:r.name,min:0,n:0,kids:{}};a.min+=r.min;a.n++;const c=a.kids[r[k2]]=a.kids[r[k2]]||{key:r[k2],name:r.name,min:0,n:0};c.min+=r.min;c.n++});return Object.values(g).sort((x,y)=>y.min-x.min)}
function lhTable(L,v){const tot=L.reduce((a,r)=>a+r.min,0),run=L.filter(r=>r.open).length,foot=`<tr class="t"><td>Total</td><td class="n">${L.length}</td><td class="n">${TMH(tot)}</td><td class="n">${TMD(tot)}</td></tr>`;
const hd=c=>`<thead><tr><th>${c}</th><th class="n">Sessions</th><th class="n">Hours (h:mm)</th><th class="n">Hours (decimal)</th></tr></thead>`,note=run?`<div class="mu">${run} session${run>1?'s are':' is'} still running; time so far is included, breaks excluded.</div>`:'';
if(v=='s')return `<div style="overflow-x:auto"><table class="lt"><thead><tr><th>Worker</th><th>Bed</th><th>Activity</th><th>Started</th><th>Completed</th><th class="n">Total hours (h:mm)</th><th class="n">Decimal</th><th>Status</th></tr></thead><tbody>${L.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.bed||'')}</td><td>${esc(r.act)}</td><td>${lhDT(r.start)}</td><td>${r.open?'-':lhDT(r.end)}</td><td class="n">${TMH(r.min)}</td><td class="n">${TMD(r.min)}</td><td>${r.open?(r.onBreak?'On break':'Running'):r.verified?'Verified':'Completed'}</td></tr>`).join('')}<tr class="t"><td colspan="5">Total</td><td class="n">${TMH(tot)}</td><td class="n">${TMD(tot)}</td><td></td></tr></tbody></table></div>${note}`;
const byW=v=='w',G=byW?lhGroup(L.map(r=>({...r,k1:r.worker,k2:r.act})),'k1','k2'):lhGroup(L.map(r=>({...r,k1:r.act,k2:r.worker})),'k1','k2');
const nm=k=>{const r=L.find(x=>x.worker==k);return r?r.name:k};
return `<div style="overflow-x:auto"><table class="lt">${hd(byW?'Worker / activity':'Activity / worker')}<tbody>${G.map(g=>`<tr class="g"><td>${esc(byW?nm(g.key):g.key)}</td><td class="n">${g.n}</td><td class="n">${TMH(g.min)}</td><td class="n">${TMD(g.min)}</td></tr>${Object.values(g.kids).sort((x,y)=>y.min-x.min).map(c=>`<tr><td style="padding-left:22px">${esc(byW?c.key:nm(c.key))}</td><td class="n">${c.n}</td><td class="n">${TMH(c.min)}</td><td class="n">${TMD(c.min)}</td></tr>`).join('')}`).join('')}${foot}</tbody></table></div>${note}`}

/* ===== Operation planner: planting date, number of waves and interval per crop; sow / harvest / wave dates calculate from the planting date ===== */
const opNum=v=>v===''||v==null||isNaN(Number(v))?null:Number(v);
const opOrig=(c,f)=>f=='start'?(c.start||''):f=='waves'?(c.nWaves==null?'':String(c.nWaves)):(c.ovr==null?'':String(c.ovr));
const opVal=(c,f)=>{const e=S.op.edits[c.id];return e&&f in e?e[f]:opOrig(c,f)};
function opCalc(c){const m=S.op.maxWaves||12,st=opVal(c,'start'),w=opNum(opVal(c,'waves')),o=opNum(opVal(c,'ovr')),n=pcD(st)&&w>0?Math.min(Math.floor(w),m):0,eff=o>0?Math.floor(o):c.dflt,ws=[];
for(let k=1;k<=n;k++){const p=pcAdd(st,(k-1)*eff);ws.push({n:k,plant:p,sow:pcAdd(p,-c.lead),harvest:pcAdd(p,c.days||0)})}
const L=ws[ws.length-1],chk=!c.id?'No crop ID':!n?'Enter date + waves':(c.resume&&L.plant>=c.resume?'Wave after open-field restart':'OK');
return{n,eff,ws,sow1:ws[0]?ws[0].sow:'',h1:ws[0]?ws[0].harvest:'',lastP:L?L.plant:'',hEnd:L?pcAdd(L.harvest,c.win||0):'',chk}}
const opChip=t=>`<span class="opchip ${t=='OK'?'ok':/^Wave/.test(t)?'bad':'na'}">${esc(t)}</span>`;
function opDetail(c,k){if(!k.n)return'<span class="mu">No waves planned yet. Enter a first planting date and a number of waves.</span>';const so=c.lead>0?'Sow ':'Sow &amp; plant ';
return k.ws.map(w=>`<span class="opw"><b>Wave ${w.n}</b> ${c.lead>0?`Sow ${pcFmt(w.sow)} &rarr; Plant ${pcFmt(w.plant)}`:`Sow &amp; plant ${pcFmt(w.plant)}`} &rarr; Harvest ${pcFmt(w.harvest)}</span>`).join('')}
function opRow(c){const k=opCalc(c),O=S.op,ro=!O.canEdit,e=O.edits[c.id],mx=O.maxWaves,inp=(f,type,extra)=>`<input data-op="${f}" data-id="${esc(c.id)}" type="${type}" value="${esc(opVal(c,f))}" ${ro?'disabled':''} ${extra||''}>`;
return`<tbody data-oprow="${esc(c.id)}" class="${e?'opd':''}"><tr><td><b>${esc(c.name)}</b><div class="mu">${esc(c.id)}</div></td><td>${c.days==null?'-':c.days} d</td><td>${c.lead>0?c.lead+' d':'none'}<div class="mu">${esc(c.method)}</div></td>
<td>${inp('start','date','')}</td><td>${inp('waves','number','min="0" max="'+mx+'" step="1" style="width:62px"')}</td><td>${inp('ovr','number','min="1" max="120" step="1" placeholder="'+c.dflt+'" style="width:72px"')}</td>
<td data-k="sow1">${k.sow1?pcFmt(k.sow1):'-'}</td><td data-k="h1">${k.h1?pcFmt(k.h1):'-'}</td><td data-k="lastP">${k.lastP?pcFmt(k.lastP):'-'}</td><td data-k="hEnd">${k.hEnd?pcFmt(k.hEnd):'-'}</td><td data-k="chk">${opChip(k.chk)}</td>
<td><button type="button" class="chip" data-a="optoggle" data-id="${esc(c.id)}" aria-expanded="${O.open.has(c.id)}">${O.open.has(c.id)?'Hide':'Waves'}</button></td></tr>
<tr class="opdet" ${O.open.has(c.id)?'':'hidden'}><td colspan="12"><div class="opwv" data-k="det">${opDetail(c,k)}</div></td></tr></tbody>`}
function opPaint(id){const c=S.op.crops.find(x=>x.id==id),tb=document.querySelector(`[data-oprow="${CSS.escape(id)}"]`);if(!c||!tb)return;const k=opCalc(c),f=x=>x?pcFmt(x):'-';
tb.querySelector('[data-k=sow1]').textContent=f(k.sow1);tb.querySelector('[data-k=h1]').textContent=f(k.h1);tb.querySelector('[data-k=lastP]').textContent=f(k.lastP);tb.querySelector('[data-k=hEnd]').textContent=f(k.hEnd);
tb.querySelector('[data-k=chk]').innerHTML=opChip(k.chk);tb.querySelector('[data-k=det]').innerHTML=opDetail(c,k);tb.classList.toggle('opd',!!S.op.edits[id])}
function opHead(){const O=S.op,h=el('ophd');if(!h)return;const n=Object.keys(O.edits).length,pl=O.crops.filter(c=>opCalc(c).n>0).length;
h.textContent=O.crops.length+' crops, '+pl+' with waves planned'+(n?', '+n+' unsaved change'+(n>1?'s':''):'');const b=el('opsave');if(b){b.disabled=!n||O.busy;b.textContent=O.busy?'Saving...':'Save'+(n?' ('+n+')':'')}}
function opView(){const o=el('ov6'),O=S.op;if(!o)return;o.style.display=O?'flex':'none';if(!O)return;const q=O.q.toLowerCase();
o.firstElementChild.innerHTML=`<div class="cpt"><div><b style="font-size:15px">Operation planner</b><div class="mu" id="ophd"></div></div><span class="row"><input type="search" id="opq" placeholder="Find a crop" value="${esc(O.q)}" style="width:150px"><button class="btn" id="opsave" data-a="opsave" disabled>Save</button><button class="btn o" data-a="opreload" ${O.busy?'disabled':''}>Reload</button><button class="btn o" data-a="opclose">Close</button></span></div>
<div class="opb"><p class="mu" style="margin:0 0 8px">Enter the <b>first planting date</b> and the <b>number of waves</b> (0 to ${O.maxWaves}); leave the interval blank to use the crop's default. Sow (propagation) date = planting date minus the crop's lead days; harvest = planting date plus days to first harvest. These are the same formulas as the Green House Operation tab, which is updated when you press Save.</p>${O.err?`<p class="operr" role="alert">${esc(O.err)}</p>`:''}
${O.loading?'<p class="mu">Loading...</p>':!O.crops.length?'<p class="mu">No crops found.</p>':`<table class="optb"><thead><tr><th>Crop</th><th>Days to 1st harvest</th><th>Propagation lead</th><th>First planting date</th><th>Waves</th><th>Interval (days)</th><th>First sow</th><th>First harvest</th><th>Last planting</th><th>Last harvest ends</th><th>Check</th><th></th></tr></thead>${O.crops.map(opRow).join('')}</table>`}</div>`;
document.querySelectorAll('[data-oprow]').forEach(t=>{t.style.display=!q||t.dataset.oprow.toLowerCase().includes(q)||t.firstElementChild.textContent.toLowerCase().includes(q)?'':'none'});opHead()}
async function opLoad(){const O=S.op;O.loading=true;O.err='';opView();try{const r=await api('ghoLoad');O.crops=r.crops;O.maxWaves=r.maxWaves||12;O.canEdit=!!r.canEdit;O.edits={}}catch(err){O.err=err.message}O.loading=false;opView()}
async function opSave(){const O=S.op,ids=Object.keys(O.edits);if(!ids.length)return;const rows=[];
for(const id of ids){const c=O.crops.find(x=>x.id==id),st=opVal(c,'start'),w=opVal(c,'waves'),o=opVal(c,'ovr'),wn=opNum(w),on=opNum(o);
if(st&&!pcD(st)){O.err=c.name+': planting date is not a valid date';opView();return}
if(w!==''&&!(Number.isInteger(wn)&&wn>=0&&wn<=O.maxWaves)){O.err=c.name+': waves must be a whole number from 0 to '+O.maxWaves;opView();return}
if(o!==''&&!(Number.isInteger(on)&&on>=1&&on<=120)){O.err=c.name+': interval must be whole days from 1 to 120 (or blank)';opView();return}
if(wn>0&&!st){O.err=c.name+': enter a first planting date for '+wn+' wave'+(wn>1?'s':'');opView();return}
rows.push({id,start:st,waves:w,ovr:o})}
O.busy=true;O.err='';opHead();try{const r=await api('ghoSave',{rows});O.crops=r.crops;O.edits={};toast('Saved '+rows.length+' crop'+(rows.length>1?'s':'')+' to Green House Operation')}catch(err){O.err=err.message}O.busy=false;opView()}
function opClose(){const O=S.op;if(O&&Object.keys(O.edits).length&&!confirm('Close without saving your changes?'))return;S.op=null;opView()}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t||!/^op(l|close|save|reload|toggle)$/.test(t.dataset.a))return;const a=t.dataset.a;
try{if(a=='opl'){if(IS_DEMO){toast('Operation planner needs the connected workbook (demo mode has no data)');return}if(!canGen()){toast('The operation planner is for the Manager role');return}S.op={crops:[],edits:{},open:new Set(),q:'',maxWaves:12,canEdit:false,busy:false,loading:true,err:''};await opLoad();return}
