<style>

<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxI5EoHK-uRAthC9-V6X1xkXaNvGJYuBmOyI4ox7xeNiTw6rmRPA6mWbw01wKzTbtw5Aw/exec';           // paste the Apps Script web app /exec URL (Code_GH.gs); blank = demo mode

BEDS.find(b=>b.id=='GH-3-B08').ok=false;
const d=o=>{const x=new Date();x.setDate(x.getDate()+o);return x.toISOString().slice(0,10)};
const C=[['ASP-GH-2027-W01','Asparagus','GH-1-R01','GROWING',-240,730,730],['SP-GH-2027-W01','Sweet Potatoes','GH-1-R02','GROWING',-120,100,120],['CAR-GH-2027-W01','Carrots','GH-1-R04','GROWING',-35,65,80],['BRO-GH-2027-W01','Broccoli','GH-1-R05','PRE_PLANTING',5,60,80],
['LET-GH-2027-W01','Lettuce','GH-2-B01','HARVEST_READY',-50,45,60],['LET-GH-2027-W02','Lettuce','GH-2-B02','GROWING',-30,45,60],['SPI-GH-2027-W01','Spinach','GH-2-B03','PRE_PLANTING',2,35,45],['KAL-GH-2027-W01','Kale','GH-2-B04','GROWING',-40,55,75],['CHD-GH-2027-W01','Swiss Chard','GH-2-B06','HARVEST_COMPLETE',-70,45,60],
['BTL-GH-2027-W01','Bitter Leaf','GH-3-B01','GROWING',-150,60,60],['UGW-GH-2027-W01','Ugwu','GH-3-B02','GROWING',-90,60,90],['UGW-GH-2027-W02','Ugwu','GH-3-B03','HARVEST_READY',-95,60,90],['SUK-GH-2027-W01','Sukuma Wiki','GH-3-B04','GROWING',-20,50,70],
['PLN-GH-2027-W01','Plantains','GH-4-G01','GROWING',-200,365,540],['TOM-GH-2027-W01','Tomatoes','GH-4-G02','GROWING',-45,60,80],['PEP-GH-2027-W01','Peppers','GH-4-G04','TERMINATED',-60,65,75]]
.map(c=>({id:c[0],crop:c[1],bed:c[2],stage:c[3],dob:d(c[4]),hs:d(c[4]+c[5]),he:d(c[4]+c[6])}));
const P=[['ONI-GH-2027-W01','Onions','GH-1-R03',7],['TUR-GH-2027-W01','Turnips','GH-1-R03',14],['COL-GH-2027-W01','Collard Greens','GH-2-B07',9],['MUS-GH-2027-W01','Mustard Greens','GH-2-B08',12],['MCH-GH-2027-W01','Mchicha','GH-3-B05',10],['AMG-GH-2027-W01','Amaranth Grain','GH-4-G02',21],['EGG-GH-2027-W01','Eggplant','GH-4-G03',8],['HAB-GH-2027-W01','Habanero','GH-4-G05',16]]
.map(p=>({id:p[0],crop:p[1],rec:p[2],date:d(p[3])}));
const EX=[{id:'EX-1',bed:'GH-4-G02',type:'Gutter drip leak',sev:'HIGH',open:true,note:'Reported on morning walk'}];
const ACTS=[];   // {id,name,group,phase,req} from ACTIVITIES_REFERENCE (live); demo seed below
if(IS_DEMO)Object.entries({'Soil & Bed Prep':['Pull plastic & drip','Bed prep & fertigation check','Install trellis'],'Crop Maintenance':['Prune & train','Scout pests','Irrigation check','Thin & weed'],'Harvest Operations':['Harvest','Grade & pack','Haul to cooler'],'Post-Harvest & Sanitation':['Clear debris','Power-wash bench or flush gutter','Verify bed ready']}).forEach(([g,l])=>l.forEach(n=>ACTS.push({id:'ACT-D'+String(ACTS.length+1).padStart(2,'0'),name:n,group:g,phase:g=='Harvest Operations'?'Harvest':g=='Post-Harvest & Sanitation'?'Post-Harvest':'Maintenance',req:g=='Post-Harvest & Sanitation'?'Yes':'No'})));
const WORKERS=['lisa','john','amara','kofi'].map(x=>({id:x,name:x[0].toUpperCase()+x.slice(1)})),HIST=[],DONE={},OVR={};   // DONE: bed -> completed activity names; OVR: bed -> {activity: {by,reason}} for manager overrides
const S={view:'stage',filt:'ALL',sel:null,tab:'Overview',net:IS_DEMO?'demo':'wait',tasks:[],cat:'ALL',user:IS_DEMO,tok:null,upd:'',err:'',crew:new Set(),picked:[],when:0,needLogin:false,queue:false};
async function api(action,payload){if(IS_DEMO)return{ok:true};const c=new AbortController(),t=setTimeout(()=>c.abort(),TIMEOUT);let j;
try{const r=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.tok,...payload}),signal:c.signal});j=await r.json()}
catch(e){S.net='offline';S.err='cannot reach web app';throw new Error('Could not reach the workbook')}finally{clearTimeout(t)}
S.net='online';S.err='';if(!j.ok){if(j.error=='Session expired'){S.tok=null;S.user=null;S.needLogin=true;try{sessionStorage.removeItem('gh')}catch(x){}}throw new Error(j.error||'Workbook rejected the change')}return j}
const WR=new Set(['gengo','vready','override','plant','ready','done','turn','term','move','verifybed','dispatch','dn','rt','appr','apprall','rej']);
async function load(){const r=await api('load');BAYS.length=BEDS.length=C.length=P.length=0;S.tasks.length=0;
ACTS.length=0;ACTS.push(...(r.activities||[]));if(!IS_DEMO&&!r.activities)toast('Web app is out of date: redeploy Code_GH.gs as a new version');else if(!IS_DEMO&&!r.activities.length)toast('ACTIVITIES_REFERENCE has no rows with Active = Yes');BAYS.push(...r.bays);BEDS.push(...r.beds);C.push(...r.cohorts);P.push(...r.proposals);S.tasks.push(...r.tasks.map((t,i)=>({...t,i})));
if(r.workers&&r.workers.length){WORKERS.length=0;WORKERS.push(...r.workers)}
HIST.length=0;HIST.push(...(r.history||[]));Object.keys(DONE).forEach(k=>delete DONE[k]);Object.assign(DONE,r.done||{});Object.keys(OVR).forEach(k=>delete OVR[k]);Object.assign(OVR,r.ovr||{});S.upd=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
const cohortOf=b=>C.find(c=>c.bed==b&&c.stage!='TERMINATED'&&c.stage!='HARVEST_COMPLETE')||C.find(c=>c.bed==b);
const propOf=b=>P.filter(p=>p.rec==b);
const exOf=b=>EX.filter(e=>e.bed==b&&e.open);
const tasksOf=b=>S.tasks.filter(t=>t.bed==b&&t.st!='DONE');
function state(b){const bd=BEDS.find(x=>x.id==b),c=cohortOf(b);
if(exOf(b).length)return'EXCEPTION';if(!bd.ok)return'UNVERIFIED';if(c&&(c.stage=='HARVEST_COMPLETE'||c.stage=='TERMINATED'))return'POST_HARVEST';if(c)return'OCCUPIED';if(propOf(b).length)return'PROPOSED';return'AVAILABLE'}
function queue(b){const c=cohortOf(b);if(exOf(b).length||(c&&c.stage=='HARVEST_READY'))return'MUST_DO';if(c&&(c.stage=='PRE_PLANTING'||state(b)=='POST_HARVEST'))return'ATTENTION';if(c)return'ROUTINE';if(propOf(b).length)return'PROPOSED';return null}
function fill(b){const st=state(b),c=cohortOf(b);if(S.view=='queue'){const q=queue(b);return q?QCOL[q]:'#E4EDE6'}
if(c)return STAGE[c.stage];return{PROPOSED:'#F6E3B0',UNVERIFIED:'#cfd4d0',AVAILABLE:'#E4EDE6',EXCEPTION:'#F2C4BF'}[st]||'#E4EDE6'}
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function drawTop(){el('net').innerHTML=S.net=='demo'?'Demo mode (no web app URL)':S.net=='wait'?'Connecting...':S.net=='online'?`<span class="dot" style="background:#66bb6a"></span>Connected${S.upd?' - updated '+S.upd:''}`:`<span class="dot" style="background:#ef5350"></span>Not connected${S.err?': '+esc(S.err):''}`;
el('plb').style.display=canGen()?'':'none';el('lg').textContent=S.user?'Log out'+(S.user.name?' ('+S.user.name+')':''):'Log in';el('ov').style.display=S.needLogin?'flex':'none';
el('tb').innerHTML=['ALL','OCCUPIED','PROPOSED','AVAILABLE','UNVERIFIED','POST_HARVEST','EXCEPTION'].map(f=>`<button class="chip ${S.filt==f?'on':''}" data-f="${f}">${f.replace('_',' ').toLowerCase()}</button>`).join('')+`<button class="btn" data-a="queue">Assignment queue (${P.length})</button>`;
el('vw').innerHTML=['stage','queue'].map(v=>`<button class="chip ${S.view==v?'on':''}" data-v="${v}">${v=='stage'?'Current stage':'Queue priority'}</button>`).join('');
const L=S.view=='stage'?Object.entries(STAGE):Object.entries(QCOL);el('lg2').innerHTML=L.map(([k,v])=>`<span><i style="background:${v}"></i>${k.replace('_',' ').toLowerCase()}</span>`).join('')+'<span><i style="background:#E4EDE6;border:1px solid #9bb0a2"></i>available</span><span><i style="background:#C77700;border-radius:50%"></i>required steps open</span>'}
function drawMap(){let y=14,h='';BAYS.forEach(b=>{h+=`<text x="12" y="${y+8}" font-size="13" font-weight="600" fill="var(--tx)">${b[1]}</text>`;y+=16;
BEDS.filter(x=>x.bay==b[0]).forEach(bd=>{const st=state(bd.id),c=cohortOf(bd.id),dim=S.filt!='ALL'&&S.filt!=st,tk=tasksOf(bd.id).length,ex=exOf(bd.id).length,sel=S.sel==bd.id,rq=c?flow(bd.id).left:0;
const lab=c?c.crop:propOf(bd.id).length?'Proposed: '+propOf(bd.id).map(p=>p.crop).join(', '):st=='UNVERIFIED'?'Not verified':'Available';
h+=`<g class="bed" tabindex="0" role="button" data-b="${bd.id}" opacity="${dim?.25:1}" aria-label="${bd.id} ${esc(lab)}"><rect x="12" y="${y}" width="756" height="26" rx="5" fill="${fill(bd.id)}" stroke="${sel?'var(--tx)':st=='PROPOSED'?'#C77700':st=='UNVERIFIED'?'#889':'var(--ln)'}" stroke-width="${sel?2.5:1}" ${st=='PROPOSED'||st=='UNVERIFIED'?'stroke-dasharray="5 3"':''}/>
<text x="22" y="${y+17}" font-size="12" font-weight="600" fill="#12201a">${bd.id}</text><text x="108" y="${y+17}" font-size="12" fill="#12201a">${esc(lab)}${c?' - '+c.stage.replace('_',' ').toLowerCase():''}</text>
${ex?`<circle cx="744" cy="${y+13}" r="8" fill="#B3261E"/><text x="744" y="${y+17}" font-size="11" text-anchor="middle" fill="#fff">!</text>`:''}${rq?`<circle cx="664" cy="${y+13}" r="8" fill="#C77700"/><text x="664" y="${y+17}" font-size="11" text-anchor="middle" fill="#fff">${rq}</text>`:''}${tk?`<circle cx="720" cy="${y+13}" r="8" fill="#1f3a2e"/><text x="720" y="${y+17}" font-size="11" text-anchor="middle" fill="#fff">${tk}</text>`:''}
${c&&c.stage=='HARVEST_READY'?`<text x="692" y="${y+18}" font-size="14">&#9986;</text>`:''}</g>`;y+=30});y+=10});
el('svg').setAttribute('viewBox','0 0 780 '+y);el('svg').innerHTML=h}
const dl=c=>c.dl||'Planting date';
/* ---- Activity rules (mirrors ACTIVITIES_REFERENCE and the checks in Code_GH.gs): phase gate, prerequisite, required steps, manager override ---- */
const STG={'Pre-Planting':['PRE_PLANTING'],'Propagation':['PRE_PLANTING'],'Planting':['PRE_PLANTING'],'Maintenance':['GROWING','HARVEST_READY'],'IPM & Calibration':['GROWING','HARVEST_READY'],'Harvest':['HARVEST_READY'],'Post-Harvest':['HARVEST_COMPLETE','TERMINATED']};
const STG_MSG={'Pre-Planting':'only before planting','Propagation':'only before planting','Maintenance':'needs a growing crop','IPM & Calibration':'needs a growing crop','Harvest':'needs manager maturity check','Post-Harvest':'after harvest is complete'};
const applies=(a,bd)=>{const m=a.name.match(/\(Bays? ([\d &]+)\)/);return!m||!bd||m[1].split(/\D+/).includes(String(bd.bay).replace(/\D/g,''))};
const isDone=(b,a)=>(DONE[b]||[]).includes(a.name),preOf=a=>a.pre?ACTS.find(x=>x.id==a.pre):null,depOf=a=>ACTS.filter(x=>x.pre==a.id);
function stageWhy(a,b){const c=cohortOf(b),ok=STG[a.phase];if(!ok)return'';const s=c?c.stage:'';
if(a.phase=='Planting')return s=='PRE_PLANTING'?(c.ver?'':'needs manager bed verification'):'needs a cohort awaiting planting';
return ok.includes(s)?'':STG_MSG[a.phase]||''}
function why(a,b){const bd=BEDS.find(x=>x.id==b);if(!applies(a,bd))return'other bay';const s=stageWhy(a,b);if(s)return s;const p=preOf(a);if(p&&!isDone(b,p))return'do '+p.id+' first';return''}
// What must happen on this bed before its next state change: required steps, with any unfinished prerequisites listed ahead of them.
function flow(b){const c=cohortOf(b),bd=BEDS.find(x=>x.id==b),dn=DONE[b]||[],ov=OVR[b]||{},s=c?c.stage:'';
const ph=s=='PRE_PLANTING'?(c.ver?['Planting']:['Pre-Planting']):s=='HARVEST_READY'?['Harvest']:s=='HARVEST_COMPLETE'?['Harvest','Post-Harvest']:s=='TERMINATED'?['Post-Harvest']:[];
const next=s=='PRE_PLANTING'?(c.ver?'Record planting date':'Verify bed ready to plant'):s=='GROWING'?'Verify harvest maturity':s=='HARVEST_READY'?'Mark harvest complete':s=='HARVEST_COMPLETE'||s=='TERMINATED'?'Verify bed ready and release':'';
const steps=[],seen=new Set(),add=(a,gate)=>{if(seen.has(a.id))return;seen.add(a.id);const p=preOf(a);if(p&&!dn.includes(p.name)&&applies(p,bd))add(p,false);steps.push({a,gate})};
ACTS.filter(a=>a.req=='Yes'&&ph.includes(a.phase)&&applies(a,bd)).forEach(a=>add(a,true));
const rows=steps.map(({a,gate})=>{const done=dn.includes(a.name),p=preOf(a),t=tasksOf(b).find(x=>x.act==a.name);
return{a,gate,done,ovr:done&&ov[a.name]||null,task:!done&&t||null,wait:!done&&p&&!dn.includes(p.name)?p:null,stg:done?'':stageWhy(a,b)}});
return{c,s,next,rows,left:rows.filter(r=>r.gate&&!r.done).length,total:rows.filter(r=>r.gate).length}}
const lk=b=>flow(b).left?'disabled title="Required steps are still open"':'';
const gnote=b=>{const f=flow(b);return f.left?`<div class="wn">${f.left} required step${f.left>1?'s':''} still open before "${esc(f.next)}". <button class="chip" data-t="Activity">Show steps</button></div>`:''};
function flowCard(b){const f=flow(b);if(!f.c)return'';const bd=BEDS.find(x=>x.id==b),inRow=a=>f.rows.some(r=>r.a.id==a.id);

case'clrp':S.picked=[];break;case'pick':{const i=S.picked.findIndex(q=>q.act==D.i);i<0?S.picked.push({act:D.i,crew:null}):S.picked.splice(i,1);break}case'rmp':S.picked.splice(+D.i,1);break;case'cust':{const q=S.picked[+D.i];q.crew=q.crew?null:[...S.crew];break}
case'pwk':{const q=S.picked[+D.i];q.crew=q.crew.includes(D.w)?q.crew.filter(x=>x!=D.w):[...q.crew,D.w];break}
case'override':{const st=el('ovs').value,r=el('ovr').value.trim();if(!st||!r){toast('Pick a step and write the reason');return}await api('override',{bed:b,act:st,reason:r});(DONE[b]=DONE[b]||[]).push(st);(OVR[b]=OVR[b]||{})[st]={by:(S.user&&S.user.name)||'you',reason:r};toast('Override logged');break}
case'plan':{if(IS_DEMO){toast('Season planning needs the connected workbook (demo mode has no data)');break}if(!canGen()){toast('Season planning is for the Manager role');break}const i=await api('planInit');S.gen={init:i,form:{year:i.defaults.year,interval:i.defaults.interval,waves:i.defaults.waves,bay:'ALL'},crops:new Set(i.crops.filter(c=>c.hasSchedule).map(c=>c.id)),res:null,done:null,payload:null,busy:false,render:true,fresh:true};break}
case'genclose':if(S.gen&&!S.gen.busy)S.gen=null;break;
case'genq':S.gen=null;S.sel=null;S.queue=true;break;
case'genall':{const g=S.gen;g.init.crops.filter(gIn).forEach(c=>g.crops.add(c.id));genDirty();g.render=true;break}
case'gennone':{const g=S.gen;g.init.crops.forEach(c=>g.crops.delete(c.id));genDirty();g.render=true;break}
case'genprev':{const g=S.gen;if(g.busy)break;const p=genRead();if(!p)break;g.busy=true;genBusy('Calculating preview...');try{g.res=await api('planPreview',p);g.payload=p;g.fresh=false}finally{g.busy=false;g.render=true}break}
case'gengo':{const g=S.gen;if(g.busy||!g.res||g.res.blocked||!g.payload)break;const s=g.res.summary;if(!confirm('Write '+s.cohorts+' new cohorts for '+s.year+' to the Seasonal Planner, Cohort Production and the Assignment queue?\n'+(s.skipped?s.skipped+' that already exist will be skipped.\n':'')+'All three are saved together or not at all.'))break;
g.busy=true;genBusy('Generating...');try{g.done=await api('planGenerate',g.payload)}finally{g.busy=false;g.render=true}break}
case'vready':{if(flow(b).left){toast('Complete or override the required steps first');return}await api('verifyBedReady',{cohort:c.id});c.ver=true;toast('Bed verified ready to plant');break}
case'plant':{if(flow(b).left){toast('Complete or override the required steps first');return}const pd=el('pd').value;if(!pd){toast('Enter the date');return}if(pd>d(0)){toast('Date cannot be in the future');return}await api('recordPlanting',{cohort:c.id,date:pd});c.stage='GROWING';c.dob=pd;toast(dl(c)+' recorded');break}
case'ready':{let reason='';if(d(0)<c.hs){reason=prompt('Earliest harvest is '+c.hs+'. Written reason to verify maturity early (required):');if(!reason)break}await api('verifyReady',{cohort:c.id,reason});c.stage='HARVEST_READY';toast('Harvest maturity verified');break}

case'done':if(flow(b).left){toast('Complete or override the required steps first');return}await api('completeHarvest',{cohort:c.id});c.stage='HARVEST_COMPLETE';toast('Harvest complete');break;
case'turn':if(flow(b).left){toast('Complete or override the required steps first');return}await api('verifyTurnover',{bed:b});C.splice(C.indexOf(c),1);delete DONE[b];toast(b+' released as available');break;
case'term':{const r=prompt('Reason for terminating this cohort?');if(r){await api('terminate',{cohort:c.id,reason:r});c.stage='TERMINATED';toast('Cohort terminated')}break}
case'move':{const free=BEDS.filter(x=>x.ok&&!cohortOf(x.id)).map(x=>x.id),n=prompt('Move to which bed?\n'+free.join(', '));if(n&&free.includes(n)){await api('moveCohort',{cohort:c.id,to:n});c.bed=n;S.sel=n;toast('Moved to '+n)}else if(n)toast('Pick an available bed')}break;
case'verifybed':await api('verifyBed',{bed:b});BEDS.find(x=>x.id==b).ok=true;toast('Bed verified');break;
case'dispatch':{const base=[...S.crew],jobs=S.picked.map(q=>({act:q.act,ws:q.crew||base}));if(!jobs.length){toast('Select at least one activity');return}if(jobs.some(j=>!j.ws.length)){toast('Select workers for every activity');return}
const date=d(S.when);for(const j of jobs)for(const w of j.ws){const k={i:S.tasks.length,bed:b,act:j.act,w,date,st:'ASSIGNED'};const r=await api('dispatch',k);k.sid=r.sid;S.tasks.push(k)}S.picked=[];toast('Dispatched '+jobs.length+' activity(ies)');break}
case'dn':{const tk=S.tasks[D.i],ai=ACTS.find(a=>a.name==tk.act);let qty='';if(ai&&ai.cnt=='Yes'){qty=prompt('Quantity completed ('+(ai.unit||'units')+')');if(qty===null||qty.trim()==='')break}await api('closeTask',{sid:tk.sid,quantity:qty});S.tasks[D.i].st='DONE';(DONE[S.tasks[D.i].bed]=DONE[S.tasks[D.i].bed]||[]).push(S.tasks[D.i].act);toast('Task closed');break}case'rt':{const n=prompt('Reassign to: '+WORKERS.map(w=>w.id).join(', '));if(WORKERS.some(w=>w.id==n)){await api('reassignTask',{sid:S.tasks[D.i].sid,to:n});S.tasks[D.i].w=n;toast('Reassigned')}break}
case'res':EX.find(x=>x.id==D.i).open=false;toast('Exception resolved');break;case'addx':if(el('xt').value){EX.push({id:'EX-'+(EX.length+1),bed:b,type:el('xt').value,sev:el('xs').value,open:true,note:'Added from board'});toast('Exception added')}break;
case'appr':if(await approve(D.i))toast('Assignment approved');break;case'apprall':for(const p of [...P])await approve(p.id);toast('All assignments approved');break;
case'rej':{const r=prompt('Reason for rejecting this proposal?');if(r){await api('rejectAssignment',{cohort:D.i,reason:r});P.splice(P.findIndex(x=>x.id==D.i),1);toast('Proposal rejected')}break}}
if(!IS_DEMO&&WR.has(D.a))await load()}catch(err){toast(err.message)}
all()});
document.addEventListener('change',e=>{const t=e.target,g=S.gen;if(g&&t.dataset&&t.dataset.gc){t.checked?g.crops.add(t.dataset.gc):g.crops.delete(t.dataset.gc);genDirty();return}
if(g&&t.id=='g-bay'){genSync();el('gcrops').innerHTML=gCrops();genDirty();return}
if(t.id=='addact'&&t.value){S.picked.push({act:t.value,crew:null});all()}});
document.addEventListener('input',e=>{const t=e.target;if(S.gen&&t.id&&t.id.slice(0,2)=='g-'&&t.id!='g-bay'){genSync();genDirty()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&S.gen&&!S.gen.busy){S.gen=null;all();return}if(e.key=='Enter'&&e.target.id=='lp')document.querySelector('[data-a=dologin]').click();if(e.key=='Enter'&&e.target.dataset&&e.target.dataset.b){e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
(async()=>{if(IS_DEMO){all();return}
[BAYS,BEDS,C,P,EX,S.tasks].forEach(a=>a.length=0);
try{const sv=JSON.parse(sessionStorage.getItem('gh')||'null');if(sv){S.tok=sv.tok;S.user=sv.user}}catch(x){}
try{const u=await api('users');el('lu').innerHTML=u.users.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.role)})</option>`).join('')}catch(err){toast(err.message)}
if(S.tok){try{await load()}catch(err){toast(err.message)}}else S.needLogin=true;
all()})();
</script></body></html>
